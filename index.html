   ===================================================================================== */
const Score = {
  bonus:0, chain:0, chainT:0, shown:0, best:0, lastShown:-1,
  reset(){ this.bonus=0; this.chain=0; this.chainT=0; this.shown=0; this.lastShown=-1; },
  total(){ return Belt.dist + this.bonus; },
  nearMiss(x,z){
    this.chainT = 2.6;
    this.chain = Math.min(this.chain+1, 9);
    const pts = Math.round(TUNING.obs.nearMissPts*(1 + (this.chain-1)*0.4));
    this.bonus += pts;
    UI.pop(x, z, (this.chain>1? '×'+this.chain+'  ':'') + '+'+pts);
    burstConfetti(x, 0.9, z, 5 + this.chain);
    Sfx.chime(this.chain);
    Fx.flash(0.08);
  },
  step(dt){
    if (this.chainT > 0){ this.chainT -= dt; if (this.chainT <= 0) this.chain = 0; }
  },
};

/* =====================================================================================
   24. UI — chunky panels, spring tweens on every value change, score counts up.
   ===================================================================================== */
const $ = (id)=> document.getElementById(id);
const Settings = { auto:false, sound:true, shake:true, quality: (inputMode==='touch') ? 3 : 2 };

const TWEEN = [];
for (let i=0;i<14;i++) TWEEN.push({ el:null, kind:0, t:0, dur:0.3, amp:1, x:0, y:0, active:false });
function tween(el, kind, dur, amp, x, y){
  for (let i=0;i<TWEEN.length;i++){
    const w = TWEEN[i];
    if (!w.active || (kind===0 && w.el===el && w.kind===0)){
      w.el=el; w.kind=kind; w.t=0; w.dur=dur; w.amp=amp; w.x=x||0; w.y=y||0; w.active=true; return w;
    }
  }
  return null;
}
function cancelTweens(el){ for (let i=0;i<TWEEN.length;i++) if (TWEEN[i].el===el) TWEEN[i].active=false; }
function stepTweens(dt){
  for (let i=0;i<TWEEN.length;i++){
    const w = TWEEN[i];
    if (!w.active) continue;
    w.t += dt;
    const t = clamp01(w.t/w.dur);
    if (w.kind===0){                                   // spring bump
      const s = 1 + (easeOutBack(t)-1)*0 + Math.sin(t*Math.PI)*(1-t)*w.amp;
      w.el.style.transform = (w.el.id==='tierBox' ? 'translateX(-50%) ' : '') + 'scale('+s.toFixed(4)+')';
    } else if (w.kind===1){                            // floating score pop
      const e = easeOutCubic(t);
      w.el.style.transform = 'translate('+(w.x)+'px,'+(w.y - 62*e)+'px) scale('+(0.7+0.5*easeOutBack(Math.min(1,t*2.4))).toFixed(3)+')';
      w.el.style.opacity = (t<0.62 ? 1 : 1-(t-0.62)/0.38).toFixed(3);
    } else if (w.kind===2){                            // card entrance with overshoot
      w.el.style.transform = 'scale('+(0.82 + 0.18*easeOutBack(t)).toFixed(4)+')';
      w.el.style.opacity = easeOutCubic(Math.min(1,t*2.2)).toFixed(3);
    }
    if (t>=1){
      w.active=false;
      if (w.kind===1) w.el.style.opacity = '0';
      if (w.kind===0) w.el.style.transform = (w.el.id==='tierBox' ? 'translateX(-50%) ' : '') + 'scale(1)';
    }
  }
}

const UI = {
  ready:false, pops:[], popI:0,
  init(){
    this.score=$('score'); this.best=$('best'); this.tierNum=$('tierNum'); this.fill=$('speedFill');
    this.scoreBox=$('scoreBox'); this.tierBox=$('tierBox'); this.surgeEl=$('surge'); this.vig=$('vig');
    this.cardStart=$('cardStart'); this.cardDead=$('cardDead'); this.deadScore=$('deadScore'); this.deadSub=$('deadSub');
    this.hint=$('hint'); this.dbg=$('dbg'); this.setPanel=$('settings'); this.setCard=$('setCard');
    const wrap=$('popWrap');
    for (let i=0;i<8;i++){ const d=document.createElement('div'); d.className='pop'; wrap.appendChild(d); this.pops.push(d); }
    this.ready = true; uiReady = true;
    this.refreshHints();
    this.bindControls();
    this.showCard(this.cardStart, true);
  },
  refreshHints(){
    const touch = PLAT.touchCapable;
    $('startKeys').innerHTML = touch
      ? 'LEFT SIDE — drag to steer<br>RIGHT SIDE — tap to jump, swipe to dive'
      : '<kbd>W A S D</kbd> / <kbd>↑←↓→</kbd> move &nbsp; <kbd>SPACE</kbd> jump<br><kbd>SHIFT</kbd> or <kbd>CLICK</kbd> dive &nbsp; <kbd>R</kbd> restart';
    this.hint.innerHTML = touch
      ? 'drag left · tap right to jump · swipe right to dive'
      : 'W A S D · SPACE jump · SHIFT dive · R restart';
  },
  bindControls(){
    const tg = (el, key, fn)=>{
      el.addEventListener('click', (e)=>{
        e.stopPropagation();
        Settings[key] = !Settings[key];
        el.dataset.on = Settings[key] ? '1':'0';
        if (fn) fn(Settings[key]);
      });
      el.dataset.on = Settings[key] ? '1':'0';
    };
    tg($('tgAuto'),'auto');
    tg($('tgSound'),'sound',(v)=>Sfx.setOn(v));
    tg($('tgShake'),'shake');
    const seg = $('segQ');
    for (const child of seg.children){
      child.dataset.on = (+child.dataset.v === Settings.quality) ? '1':'0';
      child.addEventListener('click',(e)=>{
        e.stopPropagation();
        Settings.quality = +child.dataset.v;
        for (const c2 of seg.children) c2.dataset.on = (c2===child)?'1':'0';
        Quality.apply(Settings.quality);
      });
    }
    $('btnSet').addEventListener('click',(e)=>{ e.stopPropagation(); this.toggleSettings(); });
    $('btnClose').addEventListener('click',(e)=>{ e.stopPropagation(); this.toggleSettings(false); });
    $('btnPlay').addEventListener('click',(e)=>{ e.stopPropagation(); Game.start(); });
    $('btnAgain').addEventListener('click',(e)=>{ e.stopPropagation(); Game.restart(); });
  },
  toggleSettings(force){
    const on = force===undefined ? !this.setPanel.classList.contains('on') : force;
    this.setPanel.classList.toggle('on', on);
    cancelTweens(this.setCard);
    if (on){ tween(this.setCard, 2, 0.34, 1); Game.pause(true); }
    else { this.setCard.style.opacity='0'; this.setCard.style.transform='scale(.86)'; Game.pause(false); }
  },
  showCard(el, on){
    cancelTweens(el);
    el.classList.toggle('on', on);
    if (on) tween(el, 2, 0.42, 1);
    else { el.style.opacity='0'; el.style.transform='scale(.82)'; }
  },
  tierUp(t){
    if (t<=0) return;
    this.tierNum.textContent = String(t+1);
    tween(this.tierBox, 0, 0.5, 0.30);
    burstConfetti(P.x, 1.4, P.z, 26);
    Sfx.tier();
    Fx.flash(0.14);
  },
  surge(on){
    this.surgeEl.style.opacity = on ? '1' : '0';
    this.surgeEl.style.transform = on ? 'translate(-50%,0) scale(1)' : 'translate(-50%,-14px) scale(.8)';
    this.surgeEl.style.transition = 'transform .18s cubic-bezier(.3,1.7,.5,1), opacity .16s ease';
  },
  pop(x,z,txt){
    const el = this.pops[this.popI]; this.popI = (this.popI+1)%this.pops.length;
    _v1.set(x, 1.5, z).project(camera);
    const w = window.innerWidth, h = window.innerHeight;
    const sx = clamp((_v1.x*0.5+0.5)*w, 54, w-54), sy = clamp((-_v1.y*0.5+0.5)*h, 74, h-90);
    el.textContent = txt;
    el.style.left='0px'; el.style.top='0px';
    tween(el, 1, 0.95, 1, sx-26, sy);
  },
  update(dt){
    /* score counts up, never snaps */
    const tot = Score.total();
    Score.shown = damp(Score.shown, tot, 8.5, dt);
    const iv = Math.floor(Score.shown);
    if (iv !== Score.lastShown){
      Score.lastShown = iv;
      this.score.textContent = iv < 1000 ? String(iv) : (iv/1000).toFixed(2)+'k';
    }
    const bs = Math.floor(Score.best);
    if (this._best !== bs){ this._best = bs; this.best.textContent = bs < 1000 ? String(bs) : (bs/1000).toFixed(2)+'k'; }
    const f = clamp01((Belt.speed - B.tiers[0])/(B.tiers[B.tiers.length-1]*B.surge.mul - B.tiers[0]));
    const fw = Math.round(8 + f*92);
    if (fw !== this._fw){ this._fw = fw; this.fill.style.width = fw + '%'; }
    const vg = Math.round(Fx.warn*40);
    if (vg !== this._vg){ this._vg = vg; this.vig.style.opacity = vg/58; }
  },
  showDead(){
    this.deadScore.textContent = String(Math.floor(Score.total()));
    const isBest = Score.total() >= Score.best - 0.5;
    this.deadSub.innerHTML = isBest ? 'NEW BEST' : 'BEST ' + Math.floor(Score.best);
    this.showCard(this.cardDead, true);
  },
};

/* =====================================================================================
   25. INPUT — keyboard and touch live together. Never a mode switch, never a fixed stick.
   ===================================================================================== */
const M = TUNING.mobile;
const In = {
  mx:0, mz:0, jumpHeld:false, jumpEdge:false, diveEdge:false, autoRun:false, demo:false,
  keys:Object.create(null),
  padId:-1, padOX:0, padOY:0, padCX:0, padCY:0, padOn:false, padT:0,
  actId:-1, actX:0, actY:0, actT:0, actMoved:0, actUsed:false,
  gamepad:false, gpTick:0,
  dbgTaps:0, dbgT:0,

  isUI(t){ return !!(t && t.closest && t.closest('.iconBtn,.btn,.toggle,.seg,#setCard')); },

  init(){
    addEventListener('keydown', (e)=>{
      if (e.repeat) return;
      const k = e.key.toLowerCase();
      this.keys[k] = true;
      if (k===' '||k==='arrowup'||k==='w'||k==='shift'||k==='r') e.preventDefault();
      applyInputMode('key');
      Sfx.resume();
      if (k===' '){ this.jumpEdge = true; this.jumpHeld = true; }
      if (k==='shift') this.diveEdge = true;
      if (k==='r') Game.restart();
      if (k==='escape') UI.toggleSettings();
      if (k==='f3') DBG.toggle();
      if (Game.state==='title') Game.start();
    }, {passive:false});
    addEventListener('keyup', (e)=>{
      const k = e.key.toLowerCase();
      this.keys[k] = false;
      if (k===' ') this.jumpHeld = false;
    });
    addEventListener('blur', ()=>{ for (const k in this.keys) this.keys[k]=false; this.jumpHeld=false; });

    addEventListener('gamepadconnected', ()=>{ this.gamepad = true; });
    addEventListener('gamepaddisconnected', ()=>{ this.gamepad = false; });

    const app = $('app');
    app.addEventListener('pointerdown', (e)=>this.down(e), {passive:false});
    addEventListener('pointermove', (e)=>this.move(e), {passive:false});
    addEventListener('pointerup', (e)=>this.up(e), {passive:false});
    addEventListener('pointercancel', (e)=>this.up(e), {passive:false});
    /* belt and braces against browser gestures */
    app.addEventListener('contextmenu', (e)=>e.preventDefault());
    app.addEventListener('dblclick', (e)=>e.preventDefault());
    document.addEventListener('gesturestart', (e)=>e.preventDefault());
    document.addEventListener('touchmove', (e)=>{ if (e.cancelable) e.preventDefault(); }, {passive:false});
  },

  down(e){
    Sfx.resume();
    if (this.isUI(e.target)) return;
    const touchish = e.pointerType !== 'mouse';
    if (touchish) applyInputMode('touch');
    e.preventDefault();

    /* triple-tap the top-left corner for the debug overlay */
    if (e.clientX < innerWidth*0.22 && e.clientY < innerHeight*0.15){
      const now = performance.now();
      this.dbgTaps = (now - this.dbgT < 520) ? this.dbgTaps+1 : 1;
      this.dbgT = now;
      if (this.dbgTaps >= 3){ this.dbgTaps = 0; DBG.toggle(); return; }
    }
    if (Game.state==='title'){ Game.start(); return; }
    if (Game.state==='dead'){ Game.restart(); return; }
    if (Game.paused) return;

    if (!touchish){                                  // mouse: LMB dives, RMB nothing
      if (e.button===0) this.diveEdge = true;
      return;
    }
    if (e.clientX < innerWidth*0.5){
      if (this.padId >= 0) return;
      this.padId = e.pointerId;
      this.padOX = e.clientX; this.padOY = e.clientY;
      this.padCX = e.clientX; this.padCY = e.clientY;
      this.padOn = true; this.padT = 0;
      Pad.show(this.padOX, this.padOY);
    } else {
      if (this.actId >= 0) return;
      this.actId = e.pointerId;
      this.actX = e.clientX; this.actY = e.clientY;
      this.actT = performance.now(); this.actMoved = 0; this.actUsed = false;
      /* jump fires on press: a tap must never cost the player 180ms of latency.
         if the gesture turns out to be a swipe, the dive overrides it. */
      this.jumpEdge = true; this.jumpHeld = true;
      Pad.actFx(e.clientX, e.clientY);
    }
  },

  move(e){
    if (e.pointerId === this.padId){
      e.preventDefault();
      this.padCX = e.clientX; this.padCY = e.clientY;
      let dx = this.padCX - this.padOX, dy = this.padCY - this.padOY;
      const len = Math.hypot(dx,dy);
      if (len > M.padRadius){                        // sliding origin: never run out of travel
        const k = (len - M.padRadius)/len;
        this.padOX += dx*k; this.padOY += dy*k;
        dx = this.padCX - this.padOX; dy = this.padCY - this.padOY;
        Pad.show(this.padOX, this.padOY);
      }
      Pad.knob(this.padOX + dx, this.padOY + dy);
    } else if (e.pointerId === this.actId){
      e.preventDefault();
      const dx = e.clientX - this.actX, dy = e.clientY - this.actY;
      const d = Math.hypot(dx,dy);
      this.actMoved = Math.max(this.actMoved, d);
      if (!this.actUsed && d > M.swipePx && (performance.now()-this.actT) < M.swipeMs){
        this.actUsed = true; this.diveEdge = true; this.jumpHeld = false; this.jumpEdge = false;
        Pad.actFx(e.clientX, e.clientY, true);
      }
    }
  },

  up(e){
    if (e.pointerId === this.padId){
      this.padId = -1; this.padOn = false; Pad.hide();
    } else if (e.pointerId === this.actId){
      this.actId = -1; this.jumpHeld = false;
    } else if (e.pointerType === 'mouse'){ /* nothing */ }
  },

  /* build the analog move vector every frame from whichever device is in use */
  poll(dt){
    if (this.demo){
      const t = performance.now()/1000;
      const err = P.z - B.homeZ;                       // simple station-keeping controller
      this.mz = clamp(-Belt.speed/MV.topSpeed - err*0.10, -1, 0.5);
      this.mx = Math.sin(t*0.55)*0.5;
      if (Math.sin(t*1.05) > 0.9975) this.jumpEdge = true;
      return;
    }
    let kx=0, kz=0;
    const K = this.keys;
    if (K['a']||K['arrowleft'])  kx -= 1;
    if (K['d']||K['arrowright']) kx += 1;
    if (K['w']||K['arrowup'])    kz -= 1;
    if (K['s']||K['arrowdown'])  kz += 1;

    let tx=0, tz=0;
    if (this.padOn){
      const dx = this.padCX - this.padOX, dy = this.padCY - this.padOY;
      const len = Math.hypot(dx,dy);
      if (len > M.padDead){
        const mag = Math.min(1, (len - M.padDead)/(M.padRadius - M.padDead));
        tx = dx/len*mag; tz = dy/len*mag;
      }
    }
    /* gamepad, polled sparsely: getGamepads() allocates, so it never runs every frame */
    let gx=0, gz=0;
    if (this.gamepad){
      this.gpTick -= dt;
      if (this.gpTick <= 0){
        this.gpTick = 0.10;
        const pads = navigator.getGamepads ? navigator.getGamepads() : null;
        const p0 = pads && pads[0];
        if (p0){
          this._gx = Math.abs(p0.axes[0])>0.16 ? p0.axes[0] : 0;
          this._gz = Math.abs(p0.axes[1])>0.16 ? p0.axes[1] : 0;
          const a = p0.buttons[0] && p0.buttons[0].pressed, b = p0.buttons[1] && p0.buttons[1].pressed;
          if (a && !this._gpA){ this.jumpEdge = true; applyInputMode('key'); }
          this.jumpHeld = this.jumpHeld || a; this._gpA = a;
          if (b && !this._gpB) this.diveEdge = true;
          this._gpB = b;
        }
      }
      gx = this._gx||0; gz = this._gz||0;
    }
    const useTouch = (tx!==0 || tz!==0);
    this.mx = useTouch ? tx : (kx || gx);
    this.mz = useTouch ? tz : (kz || gz);
    if (Settings.auto && inputMode==='touch'){ this.mz = -1; }   // auto-run: pad steers laterally
    this.autoRun = Settings.auto && inputMode==='touch';
  },
};

/* the drag-pad ring: soft, only while touched, fades in over 80ms, never pinned */
const Pad = {
  ring:null, knobEl:null, act:null, init(){ this.ring=$('pad'); this.knobEl=$('knob'); this.act=$('actFx'); },
  show(x,y){ this.ring.style.transform='translate('+x+'px,'+y+'px)'; this.ring.style.opacity='1'; this.knobEl.style.opacity='1'; },
  knob(x,y){ this.knobEl.style.transform='translate('+x+'px,'+y+'px)'; },
  hide(){ this.ring.style.opacity='0'; this.knobEl.style.opacity='0'; },
  actFx(x,y,big){
    this.act.style.transition='none';
    this.act.style.transform='translate('+x+'px,'+y+'px) scale(0.55)';
    this.act.style.opacity='0.95';
    requestAnimationFrame(()=>{
      this.act.style.transition='transform .28s cubic-bezier(.2,.9,.3,1), opacity .28s ease';
      this.act.style.transform='translate('+x+'px,'+y+'px) scale('+(big?2.2:1.5)+')';
      this.act.style.opacity='0';
    });
  },
};

/* =====================================================================================
   26. QUALITY — pixelRatio ladder with hysteresis, then honest fallbacks.
   An honest blob shadow at 60fps beats a real one at 45.
   ===================================================================================== */
const Quality = {
  pr:1, prMax:2, tier:2, auto:false, lowT:0, highT:0, avg:60, samples:4,
  init(){ this.apply(Settings.quality); },
  apply(mode){
    this.auto = (mode===3);
    this.tier = this.auto ? (inputMode==='touch' ? 1 : 2) : mode;
    this.applyTier();
  },
  applyTier(){
    const t = this.tier;
    SHADOW_REAL = t >= 1;
    renderer.shadowMap.enabled = SHADOW_REAL;
    keyLight.castShadow = SHADOW_REAL;
    const size = t >= 2 ? 2048 : 1024;
    if (keyLight.shadow.mapSize.x !== size){
      keyLight.shadow.mapSize.set(size,size);
      if (keyLight.shadow.map){ keyLight.shadow.map.dispose(); keyLight.shadow.map = null; }
    }
    Post.bloomLevels = t >= 2 ? 2 : (t >= 1 ? 1 : 0);
    const s = t >= 2 ? 4 : 2;
    const needResize = (s !== Post.samples);
    Post.samples = s;
    this.prMax = LIVE.prCap * (t === 0 ? 0.85 : 1);
    if (!this._started){ this.pr = Math.min(this.prMax, window.devicePixelRatio || 1); this._started = true; }
    this.pr = Math.min(this.pr, this.prMax);
    renderer.shadowMap.needsUpdate = true;
    resize(needResize);
  },
  tick(dt, fps){
    this.avg = this.avg*0.90 + fps*0.10;
    const PF = TUNING.perf;
    if (this.avg < PF.downFps){
      this.lowT += dt; this.highT = 0;
      if (this.lowT >= PF.downHold){
        this.lowT = 0;
        if (this.pr > PF.prFloor + 0.001){
          this.pr = Math.max(PF.prFloor, this.pr - PF.prStep); resize(false);
        } else if (this.auto && this.tier > 0){
          this.tier--; this.applyTier();
        }
      }
    } else if (this.avg > PF.upFps){
      this.highT += dt; this.lowT = 0;
      if (this.highT >= PF.upHold){
        this.highT = 0;
        if (this.pr < this.prMax - 0.001){ this.pr = Math.min(this.prMax, this.pr + PF.prStep); resize(false); }
        else if (this.auto && this.tier < (inputMode==='touch'?1:2)){ this.tier++; this.applyTier(); }
      }
    } else { this.lowT = Math.max(0, this.lowT - dt*0.5); this.highT = Math.max(0, this.highT - dt*0.5); }
  },
};
let SHADOW_REAL = true;

/* =====================================================================================
   27. DEBUG OVERLAY — triple-tap the top-left corner (or F3).
   ===================================================================================== */
const DBG = {
  on:false, fps:60, ft:16.7, sceneCalls:0, tris:0, nan:0, acc:0, n:0, uiT:0, worst:0, steps:0, maxSteps:0,
  toggle(){ this.on = !this.on; UI.dbg.classList.toggle('on', this.on); },
  frame(dt){
    this.acc += dt; this.n++;
    if (dt > this.worst) this.worst = dt;
    if (this.acc >= 0.25){
      this.fps = this.n/this.acc; this.ft = this.acc/this.n*1000;
      this.acc = 0; this.n = 0;
    }
  },
  update(dt){
    if (!this.on) return;
    this.uiT -= dt; if (this.uiT > 0) return;
    this.uiT = 0.2;
    const total = renderer.info.render.calls;
    UI.dbg.textContent =
      'fps      ' + this.fps.toFixed(1) + '\n' +
      'frame    ' + this.ft.toFixed(2) + ' ms  (worst ' + (this.worst*1000).toFixed(1) + ')\n' +
      'draws    ' + this.sceneCalls + ' scene / ' + total + ' total\n' +
      'tris     ' + (this.tris/1000).toFixed(1) + 'k\n' +
      'pixelR   ' + Quality.pr.toFixed(2) + '  cap ' + Quality.prMax.toFixed(2) + '\n' +
      'tier     Q' + Quality.tier + (Quality.auto?' auto':'') + '  belt T' + (Belt.tier+1) + ' ' + Belt.speed.toFixed(1) + '\n' +
      'obst     ' + obsActive.length + '/' + Spawn.count + '  lead min ' + (Spawn.minLead>50?'-':Spawn.minLead.toFixed(2)) +
        's  need ' + LIVE.legibility.toFixed(2) + 's\n' +
      'parts    ' + (FX.dust.alive+FX.spark.alive+FX.confetti.alive) + '\n' +
      'input    ' + inputMode + '  play±' + PLAY.half.toFixed(2) + '\n' +
      'state    ' + ['RUN','DIVE','SLIDE','GETUP','RAG','BLEND'][P.state] + '  nan ' + this.nan + '\n' +
      'steps    ' + this.steps + '/frame  peak ' + this.maxSteps + '  spawn-hold ' + Spawn.blocked;
    this.worst = 0;
  },
};

/* =====================================================================================
   28. RESIZE — never 100vh; the height comes from the visual viewport.
   ===================================================================================== */
const appEl = $('app');
function resize(remakeTargets){
  const vv = window.visualViewport;
  const w = Math.max(1, Math.round(vv ? vv.width : window.innerWidth));
  const h = Math.max(1, Math.round(vv ? vv.height : window.innerHeight));
  document.documentElement.style.setProperty('--app-h', h + 'px');
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Quality.pr);
  renderer.setSize(w, h, false);
  const bw = Math.max(2, Math.floor(w*Quality.pr)), bh = Math.max(2, Math.floor(h*Quality.pr));
  if (remakeTargets !== false || !Post.rt || Post.rt.width !== bw || Post.rt.height !== bh) Post.resize(bw, bh);
  /* shadow frustum stays tightly fitted to the play area, never to the whole belt */
  const c = keyLight.shadow.camera;
  c.left = -15; c.right = 15; c.top = 18; c.bottom = -18;
  c.updateProjectionMatrix();
}
addEventListener('resize', ()=>resize(false));
addEventListener('orientationchange', ()=>setTimeout(()=>resize(false), 120));
if (window.visualViewport) visualViewport.addEventListener('resize', ()=>resize(false));

/* =====================================================================================
   29. GAME FLOW
   ===================================================================================== */
const Game = {
  state:'title', paused:false, startedAt:0,
  resetWorld(){
    for (let i=obsActive.length-1;i>=0;i--) despawn(obsActive[i]);
    Belt.reset(); Belt.scoring = false;
    Score.reset();
    Spawn.gapLeft = 16; Spawn.blocked = 0; Spawn.lastLead = 9.9; Spawn.minLead = 99;
    Spawn.count = 0; Spawn.patterns = 0;
    FX.dust.life.fill(0); FX.spark.life.fill(0); FX.confetti.life.fill(0);
    Fx.streakAmt=0; Fx.flashAmt=0; Fx.warn=0; Fx.streakHold=0;
    resetPlayer();
    updatePlayArea();
    Cam.reset(); Cam.step(1/60, curPose); Cam.apply();
    UI.tierNum.textContent = '1';
    UI.surge(false);
  },
  start(){
    if (this.state !== 'title') return;
    this.state = 'play'; this.startedAt = performance.now();
    In.demo = false;
    this.resetWorld();
    Belt.scoring = true;
    UI.showCard(UI.cardStart, false);
    setTimeout(()=>{ UI.hint.style.opacity = '0'; }, 6500);
    if (inputMode === 'touch') goImmersive();
    Sfx.resume();
  },
  restart(){
    if (this.state === 'title') { this.start(); return; }
    UI.showCard(UI.cardDead, false);
    this.state = 'play';
    this.resetWorld();
    Belt.scoring = true;
    In.demo = false;
    UI.hint.style.opacity = '0';
  },
  over(){
    if (this.state !== 'play') return;
    this.state = 'dead';
    Score.best = Math.max(Score.best, Score.total());
    UI.showDead();
    Fx.flash(0.3);
  },
  pause(v){ this.paused = v; },
};
Belt.scoring = false;

function goImmersive(){
  try {
    const el = document.documentElement;
    if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen({navigationUI:'hide'}).catch(()=>{});
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  } catch(e){}
  try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('portrait').catch(()=>{}); } catch(e){}
}

/* =====================================================================================
   30. FRAME — fixed 60Hz simulation, interpolated render.
   ===================================================================================== */
const FIXED = 1/60;
let acc = 0, lastT = 0, propDz = 0, started = false;

function simulate(dt){
  if (Cam.hs > 0){ Cam.hs = Math.max(0, Cam.hs - dt); return; }   // hit-stop: the whole sim freezes
  Belt.step(dt);
  stepObstacles(dt);
  stepPlayer(dt);
  Fx.step(dt);
  Score.step(dt);
  propDz += Belt.speed*dt;
  if (P.dying){
    P.deadT += dt;
    if (P.deadT > 1.10 && Game.state === 'play') Game.over();
  }
}

function updateLights(p){
  const c = keyLight.shadow.camera;
  const snap = (c.right - c.left)/keyLight.shadow.mapSize.x;
  const tx = Math.round(p.x/snap)*snap, tz = Math.round(p.z/snap)*snap;
  const D = 30;
  keyLight.position.set(tx + KEY_DIR.x*D, KEY_DIR.y*D, tz + KEY_DIR.z*D - 3);
  keyLight.target.position.set(tx, 0.4, tz - 3);
  keyLight.target.updateMatrixWorld();
  rimLight.position.set(p.x + RIM_DIR.x*20, RIM_DIR.y*20 + 1.5, p.z + RIM_DIR.z*20);
  rimLight.target.position.set(p.x, 1.0, p.z);
  rimLight.target.updateMatrixWorld();
}

function updateWorldVisuals(p, dt, t){
  /* play-edge guides follow the player and mark the honest boundary in any aspect */
  for (let i=0;i<2;i++){
    const e = world.edges[i];
    e.position.x = (i===0 ? -1 : 1)*PLAY.half;
  }
  /* klaxons: surge telegraph */
  const warnPulse = Belt.surgeState===1 ? (Math.sin(t*24)*0.5+0.5)
                  : (Belt.surgeState>=2 && Belt.surgeState<=3 ? 1 : 0);
  const stutPulse = Belt.stutState===1 ? 1 : 0;
  for (let i=0;i<world.klaxons.length;i++){
    world.klaxons[i].emissiveIntensity = warnPulse*3.4 + stutPulse*1.2;
  }
  /* rear lip glows harder the closer you get to being thrown off it */
  world.lipMat.emissiveIntensity = 0.55 + Fx.warn*(2.4 + Math.sin(t*11)*0.9);
  world.hazMat.opacity = 0.70 + Fx.warn*0.26;
  rig.blob.material.opacity *= SHADOW_REAL ? 0.78 : 1.0;
}

let renderHalted = false;
function frame(now){
  requestAnimationFrame(frame);
  if (renderHalted) return;
  if (!lastT) lastT = now;
  let raw = (now - lastT)/1000;
  lastT = now;
  if (raw < 0) raw = 0;
  DBG.frame(raw);
  const rawClamped = Math.min(raw, 0.10);

  if (!Game.paused){
    updatePlayArea();
    In.poll(rawClamped);
    /* clamp the accumulator: a backgrounded tab must never detonate the physics */
    acc += Math.min(raw, FIXED*TUNING.perf.maxCatchUp);
    let steps = 0;
    while (acc >= FIXED && steps < TUNING.perf.maxCatchUp){
      simulate(FIXED); acc -= FIXED; steps++;
    }
    if (steps >= TUNING.perf.maxCatchUp && acc > FIXED) acc = 0;
    DBG.steps = steps; if (steps > DBG.maxSteps) DBG.maxSteps = steps;
  }
  In.jumpEdge = false; In.diveEdge = false;

  const alpha = clamp01(acc/FIXED);
  const p = lerpPose(prevPose, curPose, alpha);
  const t = now/1000;

  Cam.step(rawClamped, p);
  Cam.apply();
  applyPose(p, rawClamped);
  updateLights(p);
  updateWorldVisuals(p, rawClamped, t);

  const beltDz = Belt.speed*rawClamped;
  FX.dust.step(rawClamped, beltDz);
  FX.spark.step(rawClamped, beltDz*0.35);
  FX.confetti.step(rawClamped, beltDz);
  updateProps(propDz); propDz = 0;

  Sfx.drive();
  UI.update(rawClamped);
  stepTweens(rawClamped);

  renderer.info.reset();
  Post.render();
  Quality.tick(rawClamped, 1/Math.max(0.004, raw));
  DBG.update(rawClamped);
}

/* pause on hide; clamp catch-up on return */
document.addEventListener('visibilitychange', ()=>{
  if (document.hidden){ Game.pause(true); if (Sfx.ctx && Sfx.ctx.state==='running') Sfx.ctx.suspend(); }
  else {
    acc = 0; lastT = 0;
    Game.pause(UI.setPanel.classList.contains('on'));
    if (Sfx.ctx && Sfx.on) Sfx.ctx.resume();
  }
});

/* =====================================================================================
   31. BOOT
   ===================================================================================== */
UI.init();
In.init();
Pad.init();
Quality.init();
resize(true);
In.demo = true;
Game.resetWorld();
applyPose(curPose, 1/60);

/* warm every shader program before the first visible frame, so nothing hitches on impact */
renderer.compile(scene, camera);
{
  const sp = [];
  for (let ty=0; ty<6; ty++) sp.push(getObstacle(ty));
  for (const o of sp){ o.root.visible = true; o.root.position.set(0, 40, B.front); }
  renderer.compile(scene, camera);
  for (const o of sp){ o.root.visible = false; }
}
burstDust(0, 0.1, B.homeZ, 0.2, 1, '#ffffff'); burstSparks(0, 40, B.front, 1, 0,1,0);
burstConfetti(0, 40, B.front, 4);
FX.dust.step(0.001, 0); FX.spark.step(0.001, 0); FX.confetti.step(0.001, 0);
renderer.compile(scene, camera);
FX.dust.life.fill(0); FX.spark.life.fill(0); FX.confetti.life.fill(0);
FX.dust.step(0.001,0); FX.spark.step(0.001,0); FX.confetti.step(0.001,0);

$('boot').classList.add('gone');
setTimeout(()=>{ const b=$('boot'); if (b && b.parentNode) b.parentNode.removeChild(b); }, 500);
requestAnimationFrame(frame);

/* expose a tiny handle for automated feel/perf testing — harmless in normal play */
window.BR = { TUNING, LIVE, P, Belt, Game, In, Score, Quality, DBG, Post, PLAY, Spawn, Settings, Sfx,
  obsActive, obsPool, FX, Cam, Fx, ST, OT, OBS_DEF, applyInputMode, resize, camera, renderer, scene, rig, THREE,
  simulate, updatePlayArea, stepPlayer, doJump, startDive, startRagdoll, spawnPattern, spawnZBase, getObstacle,
  curPose, prevPose, FIXED,
  haltRender(v){ renderHalted = !!v; lastT = 0; acc = 0; },
  applyPoseNow(){ applyPose(renderPose, 1/60); },
  /* headless-test driver: advance the fixed-step simulation without waiting on rAF */
  sim(n, opts){
    for (let i=0;i<(n|0);i++){
      if (opts && opts.each) opts.each(i);
      updatePlayArea();
      simulate(FIXED);
      Cam.step(FIXED, lerpPose(prevPose, curPose, 1));
      Cam.apply();
      In.jumpEdge = false; In.diveEdge = false;
    }
  } };
</script>
