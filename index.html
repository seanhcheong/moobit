/* ---- pooled obstacle instances ----------------------------------------------------- */
const obsPool = [];
const obsActive = [];
function makeObstacle(type){
  const d = OBS_DEF[type];
  const root = new THREE.Group(); root.visible = false;
  const body = new THREE.Mesh(d.geo, d.mat);
  body.castShadow = true; body.receiveShadow = false;
  root.add(body);
  let arm = null;
  if (d.armGeo){
    arm = new THREE.Group();
    const m = new THREE.Mesh(d.armGeo, d.armMat); m.castShadow = true;
    arm.add(m);
    arm.position.y = d.pivotY !== undefined ? d.pivotY : d.hubY;
    root.add(arm);
  }
  if (d.slick){ body.castShadow = false; }
  scene.add(root);
  return { type, root, body, arm, def:d,
    x:0, z:0, k:1, phase:0, spin:0, alive:false, touched:false, minDist:99, scored:false,
    dropT:1, sweepAmp:0, sweepFreq:0, bx:0, by:0, spawnLead:0 };
}
function getObstacle(type){
  for (let i=0;i<obsPool.length;i++) if (!obsPool[i].alive && obsPool[i].type===type) return obsPool[i];
  const o = makeObstacle(type); obsPool.push(o); return o;
}

/* =====================================================================================
   15. PLAY AREA — derived from the camera frustum at the player's Z every frame, so the
   gameplay space is identical in every aspect ratio. Lateral speed scales with it, which
   keeps a full dodge the same *duration* in portrait as it is in landscape.
   ===================================================================================== */
const PLAY = { half: REF_HALF, latK: 1, portrait:false, aspect:1 };
function updatePlayArea(){
  const aspect = camera.aspect;
  PLAY.aspect = aspect;
  PLAY.portrait = aspect < 1.0;
  // distance from camera to the player along the view axis, using the *base* fov so the
  // fov kick never jitters the playable width
  camera.getWorldDirection(_v1);
  /* reference point, not the live player: a ragdoll falling into the pit must never
     rescale the playfield mid-death */
  /* x taken from the camera itself: lateral movement must not make the playfield breathe */
  _v2.set(camera.position.x, 1.0, clamp(P.z, B.front, B.rear)).sub(camera.position);
  const dist = clamp(_v2.dot(_v1), 6, 40);
  const halfH = Math.tan(TUNING.cam.fovBase*0.5*Math.PI/180) * dist;
  const halfW = halfH * aspect;
  PLAY.half = clamp(halfW*0.78, 3.05, REF_HALF);
  PLAY.latK = PLAY.half / REF_HALF;
}

/* =====================================================================================
   16. PLAYER
   ===================================================================================== */
const ST = { RUN:0, DIVE:1, SLIDE:2, GETUP:3, RAG:4, BLEND:5 };
const RAG_FLOOR = 0.63;   // body half-width: how high the centre sits when it lies on its side
const J = TUNING.jump, MV = TUNING.move, DV = TUNING.dive, RG = TUNING.ragdoll;

function mkPose(){
  return { x:0,y:0,z:0, qx:0,qy:0,qz:0,qw:1, sx:1,sy:1,sz:1, pivot:0, flat:1,
    phase:0, speedN:0, vyN:0, accX:0, accZ:0, breath:0, blink:0, twitch:0, getT:0, groundY:0,
    w:{run:1,air:0,dive:0,get:0,rag:0} };
}
function copyPose(d,s){
  d.x=s.x; d.y=s.y; d.z=s.z; d.qx=s.qx; d.qy=s.qy; d.qz=s.qz; d.qw=s.qw;
  d.sx=s.sx; d.sy=s.sy; d.sz=s.sz; d.pivot=s.pivot; d.flat=s.flat;
  d.phase=s.phase; d.speedN=s.speedN; d.vyN=s.vyN; d.accX=s.accX; d.accZ=s.accZ;
  d.breath=s.breath; d.blink=s.blink; d.twitch=s.twitch; d.getT=s.getT; d.groundY=s.groundY;
  d.w.run=s.w.run; d.w.air=s.w.air; d.w.dive=s.w.dive; d.w.get=s.w.get; d.w.rag=s.w.rag;
}

const P = {
  x:0, y:0, z:B.homeZ, vx:0, vy:0, vz:0,
  pvx:0, pvz:0, accX:0, accZ:0,
  grounded:true, airT:0, coyoteT:0, bufferT:0, jumpHeld:false, apexLeft:0, jumped:false,
  state:ST.RUN, stateT:0, getT:0, slideT:0, diveCd:0,
  yaw:0, yawVel:0, roll:0, pitch:0,
  sqY:1, sqYV:0, sqXZ:1, sqXZV:0, flat:1,
  phase:0, speedN:0, breath:0, blinkT:1.8, blink:0, twitchT:4, twitch:0,
  onSlick:false, slickT:0,
  rv:new THREE.Vector3(), rav:new THREE.Vector3(), rq:new THREE.Quaternion(), rcy:0, settleT:0,
  blendT:0, dying:false, deadT:0, alive:true,
  w:{run:1,air:0,dive:0,get:0,rag:0}, wt:{run:1,air:0,dive:0,get:0,rag:0},
  height:1.62, radius:0.52,
  lastLandVy:0, nearMissChain:0,
};
const prevPose = mkPose(), curPose = mkPose(), renderPose = mkPose();

function resetPlayer(){
  P.x=0; P.y=0; P.z=B.homeZ; P.vx=0; P.vy=0; P.vz=0; P.pvx=0; P.pvz=0; P.accX=0; P.accZ=0;
  P.grounded=true; P.airT=0; P.coyoteT=LIVE.coyote; P.bufferT=0; P.jumpHeld=false; P.apexLeft=0; P.jumped=false;
  P.state=ST.RUN; P.stateT=0; P.getT=0; P.slideT=0; P.diveCd=0;
  P.yaw=0; P.yawVel=0; P.roll=0; P.pitch=0;
  P.sqY=1; P.sqYV=0; P.sqXZ=1; P.sqXZV=0; P.flat=1;
  P.phase=0; P.speedN=0; P.breath=0; P.blinkT=1.8; P.blink=0; P.twitchT=4; P.twitch=0;
  P.onSlick=false; P.slickT=0; P.settleT=0; P.blendT=0;
  P.rv.set(0,0,0); P.rav.set(0,0,0); P.rq.identity(); P.rcy=BODY_Y;
  P.dying=false; P.deadT=0; P.alive=true; P.nearMissChain=0;
  P.w.run=1; P.w.air=0; P.w.dive=0; P.w.get=0; P.w.rag=0;
  P.wt.run=1; P.wt.air=0; P.wt.dive=0; P.wt.get=0; P.wt.rag=0;
  writePose(curPose, 1/60); copyPose(prevPose, curPose);
}

/* squash impulse: snap now, spring back — never a linear tween */
function squashTo(y, xz){ P.sqY = y; P.sqXZ = xz; P.sqYV = 0; P.sqXZV = 0; }
function springScale(dt){
  const w = 22.0, z = 0.52;                        // slight overshoot => bounce
  const k = w*w, c = 2*z*w;
  P.sqYV  += (-k*(P.sqY -1) - c*P.sqYV )*dt; P.sqY  += P.sqYV *dt;
  P.sqXZV += (-k*(P.sqXZ-1) - c*P.sqXZV)*dt; P.sqXZ += P.sqXZV*dt;
}

function setWeightTargets(){
  const w = P.wt;
  w.run=0; w.air=0; w.dive=0; w.get=0; w.rag=0;
  switch (P.state){
    case ST.RUN:   if (P.grounded) w.run=1; else w.air=1; break;
    case ST.DIVE:  w.dive=1; break;
    case ST.SLIDE: w.dive=1; break;
    case ST.GETUP: w.get=1; break;
    case ST.RAG:   w.rag=1; break;
    case ST.BLEND: w.rag=1-clamp01(P.blendT/RG.blend); w.get=1-w.rag; break;
  }
}
function stepWeights(dt){
  setWeightTargets();
  const fast = ANIM.blendFast, ragRate = 1/RG.blend;
  const rate = (P.state===ST.BLEND) ? ragRate*3.4 : fast;
  P.w.run = damp(P.w.run, P.wt.run, rate, dt);
  P.w.air = damp(P.w.air, P.wt.air, rate, dt);
  P.w.dive= damp(P.w.dive,P.wt.dive,rate, dt);
  P.w.get = damp(P.w.get, P.wt.get, rate, dt);
  P.w.rag = (P.state===ST.BLEND) ? P.wt.rag : damp(P.w.rag, P.wt.rag, P.wt.rag>P.w.rag?60:ragRate, dt);
  const s = P.w.run+P.w.air+P.w.dive+P.w.get+P.w.rag || 1;
  P.w.run/=s; P.w.air/=s; P.w.dive/=s; P.w.get/=s; P.w.rag/=s;
}

/* ---- transitions ------------------------------------------------------------------- */
function doJump(){
  const gRise = J.gravityFall*J.riseRatio;
  P.vy = Math.sqrt(2*gRise*J.height);
  P.grounded = false; P.coyoteT = 0; P.bufferT = 0; P.apexLeft = J.apexFrames; P.jumped = true;
  P.state = ST.RUN;
  squashTo(0.82, 1.12);
  burstDust(P.x, 0.02, P.z, 0.55, 1.0, '#efe2c6');
  Sfx.jump();
}
function startDive(){
  if (P.diveCd > 0) return;
  const s = MV.topSpeed*DV.speedMul;
  const dx = -Math.sin(P.yaw), dz = -Math.cos(P.yaw);
  P.vx = dx*s*PLAY.latK; P.vz = dz*s;
  P.vy = Math.max(P.vy, 0) + DV.upKick;
  P.grounded = false; P.state = ST.DIVE; P.stateT = 0; P.diveCd = DV.cooldown + 0.3;
  P.bufferT = 0; P.jumped = false;
  squashTo(0.90, 1.16);
  Cam.shake(2.0); Fx.streak(TUNING.fx.streakDive, 0.5);
  burstDust(P.x, 0.05, P.z, 0.8, 1.4, '#f0e6cc');
  Sfx.dive();
}
function startRagdoll(ix,iy,iz, offX, offY, power){
  if (P.state===ST.RAG || P.state===ST.BLEND) {           // already limp: just add energy
    P.rv.x += ix; P.rv.y += iy; P.rv.z += iz; return;
  }
  P.state = ST.RAG; P.stateT = 0; P.settleT = 0;
  P.rcy = P.y + BODY_Y;
  P.rv.set(P.vx + ix, Math.max(P.vy, 0) + iy, P.vz + iz + beltDragNow());
  const sp = RG.spinPerImpulse;
  P.rav.set(
    (iy*offX - ix*offY)*sp*0.35 + rndR(-1.2,1.2),
    (ix*0.2 - iz*0.2)*sp + rndR(-2.0,2.0),
    (-iy*offX*0.9 - iz*offY)*sp + rndR(-1.2,1.2)
  );
  P.rav.clampLength(0, 15);
  _e1.set(P.pitch, P.yaw, P.roll, 'YXZ'); P.rq.setFromEuler(_e1);
  Cam.hitStop(TUNING.cam.hitStop);
  Cam.shake(clamp(power*0.55, 1.2, 6.0));
  burstSparks(P.x, P.y+0.9, P.z, clamp(power*0.4,1,3), ix*0.4, 1, iz*0.4);
  burstDust(P.x, P.y+0.3, P.z, 1.0, 1.5, '#e8dcc2');
  Sfx.bonk(clamp01(power/14));
  P.nearMissChain = 0;
}

function beltDragNow(){ return Belt.speed * (P.grounded ? 1 : B.airDrag); }

/* ---- the fixed 60Hz step ----------------------------------------------------------- */
function stepPlayer(dt){
  const locked = (P.state===ST.DIVE || P.state===ST.SLIDE || P.state===ST.GETUP ||
                  P.state===ST.RAG  || P.state===ST.BLEND);
  P.stateT += dt; P.diveCd = Math.max(0, P.diveCd - dt);
  if (P.slickT > 0) P.slickT -= dt;
  P.onSlick = P.slickT > 0;

  /* ---------- input ---------- */
  let ix = 0, iz = 0;
  if (!locked && P.alive){
    ix = In.mx; iz = In.mz;
    if (In.autoRun) iz = Math.min(iz, -1);              // auto-run holds forward throttle
    const l = Math.hypot(ix,iz);
    if (l > 1){ ix/=l; iz/=l; }
  }

  /* ---------- jump timers (coyote + buffer, both widened on touch) ---------- */
  if (In.jumpEdge){ P.bufferT = LIVE.buffer; In.jumpEdge = false; }
  P.bufferT = Math.max(0, P.bufferT - dt);
  if (P.grounded && (P.state===ST.RUN)) P.coyoteT = LIVE.coyote; else P.coyoteT = Math.max(0, P.coyoteT - dt);
  if (In.diveEdge){ In.diveEdge = false; if (!locked && P.alive) startDive(); }
  if (P.bufferT > 0 && P.coyoteT > 0 && P.state === ST.RUN && P.alive && !P.dying) doJump();
  if (!In.jumpHeld && P.jumped && P.vy > 0){ P.vy *= J.cutMul; P.jumped = false; }  // variable height

  /* ---------- ragdoll branch ---------- */
  if (P.state===ST.RAG){
    const g = J.gravityFall*1.06;
    P.rv.y -= g*dt;
    const onGround = P.rcy <= RAG_FLOOR + 0.001;
    P.x += P.rv.x*dt;
    P.z += (P.rv.z + (onGround ? Belt.speed*RG.beltGrab : Belt.speed*B.airDrag*0.5))*dt;
    P.rcy += P.rv.y*dt;
    const floorY = (P.z > B.rear + 0.4) ? -60 : RAG_FLOOR;
    if (P.rcy < floorY){
      P.rcy = floorY;
      if (P.rv.y < -1.2){
        burstDust(P.x, 0.05, P.z, clamp01(-P.rv.y/12)*0.9, 1.2, '#e6d9bd');
        Sfx.thud(clamp01(-P.rv.y/16));
      }
      P.rv.y = -P.rv.y*RG.restitution;
      if (Math.abs(P.rv.y) < 0.8) P.rv.y = 0;
      P.rv.x *= RG.friction; P.rv.z *= RG.friction;
      P.rav.multiplyScalar(0.62);
    }
    const ad = Math.exp(-RG.angDamp*dt);
    P.rav.multiplyScalar(ad);
    // quaternion integration from angular velocity
    _q1.set(P.rav.x*dt*0.5, P.rav.y*dt*0.5, P.rav.z*dt*0.5, 1).normalize();
    P.rq.premultiply(_q1);
    P.x = clamp(P.x, -PLAY.half-1.2, PLAY.half+1.2);
    P.y = P.rcy - BODY_Y;
    // settle test
    if (P.rcy <= floorY+0.02 && P.rav.length() < RG.settleAng && Math.hypot(P.rv.x,P.rv.y,P.rv.z) < RG.settleVel){
      P.settleT += dt;
      if (P.settleT >= RG.settleTime && !P.dying){ P.state = ST.BLEND; P.blendT = 0; P.getT = 0; }
    } else P.settleT = 0;
    P.speedN = 0;
    springScale(dt); stepWeights(dt); stepIdle(dt);
    finishStep(dt, 0, 0);
    return;
  }

  /* ---------- blend-back: pose returns over 300ms, position eases up to standing ---- */
  if (P.state===ST.BLEND){
    P.blendT += dt;
    const t = clamp01(P.blendT/RG.blend);
    P.rq.slerp(_q1.identity(), clamp01(dt*10.0));
    P.x += P.rv.x*dt*(1-t); P.rv.x *= Math.exp(-6*dt);
    P.z += (P.rv.z*(1-t) + Belt.speed*RG.beltGrab)*dt; P.rv.z *= Math.exp(-6*dt);
    P.rcy = damp(P.rcy, BODY_Y, 9, dt);
    P.y = lerp(0, P.rcy-BODY_Y, 1-t);
    P.vx = 0; P.vz = 0; P.vy = 0; P.grounded = true;
    P.yaw = damp(P.yaw, 0, 5, dt); P.roll = damp(P.roll, 0, 8, dt); P.pitch = damp(P.pitch, 0, 8, dt);
    if (P.blendT >= RG.blend){ P.state = ST.GETUP; P.getT = 0; P.y = 0; }
    P.speedN = 0;
    springScale(dt); stepWeights(dt); stepIdle(dt);
    finishStep(dt, 0, 0);
    return;
  }

  /* ---------- horizontal locomotion ---------- */
  const slickA = P.onSlick ? MV.slickAccelMul : 1;
  const slickD = P.onSlick ? MV.slickDecelMul : 1;
  const air = !P.grounded;
  const airMul = air ? MV.airControlScale : 1;
  const aBase = (MV.topSpeed/MV.accelTime) * airMul * slickA;
  const dBase = (MV.topSpeed/MV.decelTime) * (air ? 0.22 : 1) * slickD;
  const tBase = aBase * MV.turnAccelScale;

  if (P.state===ST.RUN){
    const latK = PLAY.latK;
    let dvx = ix*MV.topSpeed*latK, dvz = iz*MV.topSpeed;
    // silent dodge assist: touch only, inside a near-miss window, correct direction only
    let assist = 1;
    if (inputMode==='touch' && ix !== 0 && Threat.active && Math.sign(ix)===Threat.dodgeDir) assist = LIVE.dodgeAssist;
    P.vx = ix !== 0 ? moveTo(P.vx, dvx, ((P.vx*dvx < 0) ? tBase : aBase)*latK*assist*dt) : moveTo(P.vx, 0, dBase*latK*dt);
    P.vz = iz !== 0 ? moveTo(P.vz, dvz, ((P.vz*dvz < 0) ? tBase : aBase)*dt)            : moveTo(P.vz, 0, dBase*dt);
  } else if (P.state===ST.SLIDE){
    const sp = Math.hypot(P.vx,P.vz);
    if (sp > 0.001){
      const ns = Math.max(0, sp - DV.slideDecel*(P.onSlick?0.35:1)*dt);
      P.vx = P.vx/sp*ns; P.vz = P.vz/sp*ns;
    }
    P.slideT += dt;
    if (P.slideT % 0.055 < dt) burstDust(P.x - P.vx*0.06, 0.06, P.z - P.vz*0.06, 0.34, 0.85, '#efe4c8');
    if ((Math.hypot(P.vx,P.vz) < DV.slideEndSpd && P.slideT > DV.minSlide) || P.slideT > DV.slideMax){
      P.state = ST.GETUP; P.getT = 0;
    }
  } else if (P.state===ST.GETUP){
    P.getT += dt;
    P.vx = moveTo(P.vx, 0, 26*dt); P.vz = moveTo(P.vz, 0, 26*dt);
    if (P.getT >= LIVE.getUp){ P.state = ST.RUN; P.stateT = 0; }
  } else if (P.state===ST.DIVE){
    P.vx *= Math.exp(-0.5*dt); P.vz *= Math.exp(-0.5*dt);   // committed: no steering at all
  }

  /* ---------- gravity: asymmetric, with an apex hang ---------- */
  if (!P.grounded){
    let g = P.vy > 0 ? J.gravityFall*J.riseRatio : J.gravityFall;
    if (Math.abs(P.vy) < J.apexVel && P.apexLeft > 0){ g *= J.apexScale; P.apexLeft--; }
    P.vy -= g*dt;
    P.y += P.vy*dt;
  }

  /* ---------- integrate + belt drag ---------- */
  const drag = beltDragNow();
  P.x += P.vx*dt;
  P.z += (P.vz + drag)*dt;

  /* ---------- ground contact ---------- */
  if (P.y <= 0){
    const wasAir = !P.grounded;
    P.y = 0;
    if (wasAir && P.vy < 0){
      const impact = clamp01(-P.vy / J.landHardVel);
      P.lastLandVy = -P.vy;
      if (P.state === ST.DIVE){
        P.state = ST.SLIDE; P.slideT = 0;
        squashTo(0.70, 1.30);
        burstDust(P.x, 0.05, P.z, 1.0, 1.9, '#f2e8cf');
        Cam.shake(1.6); Sfx.slide();
      } else {
        squashTo(1 - 0.34*impact, 1 + 0.30*impact);
        if (impact > 0.10){
          burstDust(P.x, 0.03, P.z, 0.35 + impact*1.0, 1.15, '#efe3c8');
          Cam.shake(impact*2.6); Cam.dipKick(impact); Sfx.land(impact);
        }
      }
    }
    P.vy = 0; P.grounded = true; P.apexLeft = 0; P.airT = 0;
  } else { P.grounded = false; P.airT += dt; }

  /* ---------- lateral bounds: the honest playable width ----------
     the margin scales with the width so a full dodge costs the same TIME in any aspect */
  const lim = PLAY.half - 0.42*PLAY.latK;
  if (P.x < -lim){ P.x = -lim; if (P.vx<0) P.vx *= -0.24; }
  if (P.x >  lim){ P.x =  lim; if (P.vx>0) P.vx *= -0.24; }

  /* ---------- front roller: solid bumper ---------- */
  const frontLimit = B.front + 1.05;
  if (P.z < frontLimit){
    const closing = -(P.vz + drag);
    P.z = frontLimit;
    if (closing > B.frontBonk.ragdollAt){
      startRagdoll(0, B.frontBonk.up, B.frontBonk.push*1.5, 0, 0.4, closing);
      Fx.flash(0.5);
    } else if (closing > 0.6){
      P.vz = Math.abs(closing)*0.55 + 2.0;
      P.vy = Math.max(P.vy, B.frontBonk.up*0.55);
      P.grounded = false;
      squashTo(1.16, 0.86);
      Cam.shake(1.6); Sfx.bounce(clamp01(closing/10));
      burstDust(P.x, 0.5, P.z, 0.6, 1.2, '#ffe0b0');
    } else if (P.vz < 0) P.vz = 0;
  }

  /* ---------- rear lip: thrown off the back ---------- */
  if (P.z > B.rear && !P.dying && Game.state === 'play'){
    P.dying = true; P.deadT = 0;
    startRagdoll(rndR(-3,3), B.rearThrow.up, B.rearThrow.back, 0.3, 0.5, 16);
    P.rav.set(rndR(-9,9), rndR(-4,4), B.rearThrow.spin);
    Fx.flash(0.85); Cam.shake(6.5); Sfx.death();
  }

  /* ---------- facing, banking, lean ---------- */
  const selfSpeed = Math.hypot(P.vx/Math.max(0.2,PLAY.latK), P.vz);
  if (P.state !== ST.GETUP && selfSpeed > 0.55){
    const target = Math.atan2(-P.vx/Math.max(0.2,PLAY.latK), -P.vz);
    const diff = wrapPi(target - P.yaw);
    const want = clamp(diff*MV.turnRate, -16, 16);
    P.yawVel = damp(P.yawVel, want, 26, dt);
  } else P.yawVel = damp(P.yawVel, 0, 18, dt);
  P.yaw = wrapPi(P.yaw + P.yawVel*dt);

  const bankT = clamp(-P.yawVel*MV.bankPerAngVel, -MV.bankMax, MV.bankMax);
  P.roll = damp(P.roll, bankT*(P.grounded?1:0.6), 13, dt);

  P.accX = (P.vx - P.pvx)/dt; P.accZ = (P.vz - P.pvz)/dt;
  P.pvx = P.vx; P.pvz = P.vz;
  const fwdAcc = -(P.accX*Math.sin(P.yaw) + P.accZ*Math.cos(P.yaw));
  let pitchT = -clamp(fwdAcc*MV.leanPerAccel, -MV.leanMax, MV.leanMax);
  if (P.state===ST.DIVE)  pitchT = -1.18;
  if (P.state===ST.SLIDE) pitchT = -1.30;
  if (P.state===ST.GETUP) pitchT = -1.05*(1-easeOutCubic(P.getT/LIVE.getUp)) + Math.sin(P.getT*22)*0.10*(1-clamp01(P.getT*1.7));
  P.pitch = damp(P.pitch, pitchT, (P.state===ST.DIVE||P.state===ST.SLIDE)?26:11, dt);

  /* ---------- animation drivers ---------- */
  P.speedN = clamp01(selfSpeed / MV.topSpeed);
  if (P.grounded && P.state===ST.RUN) P.phase += selfSpeed*ANIM.strideRate*dt;
  else P.phase += (P.state===ST.RAG?0.6:1.6)*dt;

  /* running dust trail + skid puffs */
  if (P.grounded && P.state===ST.RUN){
    Fx.dustTrail(dt, selfSpeed);
    if (selfSpeed > MV.skidSpeed && ix===0 && iz===0 && rnd() < dt*22){
      burstDust(P.x - P.vx*0.05, 0.03, P.z - P.vz*0.05, 0.35, 1.1, '#e9dcc0');
    }
  }

  const flatT = (P.state===ST.SLIDE) ? 0.76 : (P.state===ST.DIVE ? 0.90 : 1.0);
  P.flat = damp(P.flat, flatT, 15, dt);

  springScale(dt); stepWeights(dt); stepIdle(dt);
  finishStep(dt, ix, iz);
}

/* idle life: breathing, blink on a randomised timer, antenna twitch */
function stepIdle(dt){
  P.breath = Math.sin(P.stateT*1.7)*0.012*(1-P.speedN*0.7);
  P.blinkT -= dt;
  if (P.blinkT <= 0){ P.blinkT = rndR(2.2, 5.4); P.blink = 1; }
  P.blink = Math.max(0, P.blink - dt*7.5);
  P.twitchT -= dt;
  if (P.twitchT <= 0){ P.twitchT = rndR(3.0, 7.5); P.twitch = 1; }
  P.twitch = Math.max(0, P.twitch - dt*4.0);
}

function writePose(pose, dt){
  pose.x = P.x; pose.y = P.y; pose.z = P.z;
  /* squash pops on takeoff/landing; the stretch belongs at the apex, where |vy| is small */
  const apexN = P.grounded ? 0 : (1 - clamp01(Math.abs(P.vy)/(J.apexVel*1.7)));
  const stretch = smooth(apexN) * 0.10 * clamp01(P.airT/0.09);
  pose.sy = P.sqY*(1+stretch);
  pose.sx = P.sqXZ*(1-stretch*0.62);
  pose.sz = pose.sx;
  pose.pivot = -BODY_Y*P.w.rag;
  pose.flat = P.flat;
  _e1.set(P.pitch, P.yaw, P.roll, 'YXZ'); _q2.setFromEuler(_e1);
  if (P.w.rag > 0.0005) _q2.slerp(P.rq, P.w.rag);
  pose.qx=_q2.x; pose.qy=_q2.y; pose.qz=_q2.z; pose.qw=_q2.w;
  pose.phase = P.phase; pose.speedN = P.speedN;
  pose.vyN = clamp(P.vy/12, -1, 1);
  pose.accX = P.accX; pose.accZ = P.accZ;
  pose.breath = P.breath; pose.blink = P.blink; pose.twitch = P.twitch;
  pose.getT = P.getT; pose.groundY = 0;
  pose.w.run=P.w.run; pose.w.air=P.w.air; pose.w.dive=P.w.dive; pose.w.get=P.w.get; pose.w.rag=P.w.rag;
}
function finishStep(dt, ix, iz){
  if (!Number.isFinite(P.x) || !Number.isFinite(P.y) || !Number.isFinite(P.z)){
    DBG.nan++; P.x=0; P.y=0; P.z=B.homeZ; P.vx=P.vy=P.vz=0;    // physics can never NaN out
  }
  copyPose(prevPose, curPose);
  writePose(curPose, dt);
}

/* interpolated pose for rendering — fixed timestep, smooth output */
function lerpPose(a,b,t){
  const o = renderPose;
  o.x=lerp(a.x,b.x,t); o.y=lerp(a.y,b.y,t); o.z=lerp(a.z,b.z,t);
  _q1.set(a.qx,a.qy,a.qz,a.qw); _q2.set(b.qx,b.qy,b.qz,b.qw);
  _q1.slerp(_q2,t);
  o.qx=_q1.x; o.qy=_q1.y; o.qz=_q1.z; o.qw=_q1.w;
  o.sx=lerp(a.sx,b.sx,t); o.sy=lerp(a.sy,b.sy,t); o.sz=lerp(a.sz,b.sz,t);
  o.pivot=lerp(a.pivot,b.pivot,t); o.flat=lerp(a.flat,b.flat,t);
  o.phase=lerp(a.phase,b.phase,t); o.speedN=lerp(a.speedN,b.speedN,t); o.vyN=lerp(a.vyN,b.vyN,t);
  o.accX=lerp(a.accX,b.accX,t); o.accZ=lerp(a.accZ,b.accZ,t);
  o.breath=lerp(a.breath,b.breath,t); o.blink=lerp(a.blink,b.blink,t); o.twitch=lerp(a.twitch,b.twitch,t);
  o.getT=lerp(a.getT,b.getT,t); o.groundY=0;
  o.w.run=lerp(a.w.run,b.w.run,t); o.w.air=lerp(a.w.air,b.w.air,t); o.w.dive=lerp(a.w.dive,b.w.dive,t);
  o.w.get=lerp(a.w.get,b.w.get,t); o.w.rag=lerp(a.w.rag,b.w.rag,t);
  return o;
}

/* =====================================================================================
   17. SCREEN FX BUS — streaks, flashes, hazard warning, running dust.
   ===================================================================================== */
const Fx = {
  streakAmt:0, streakHold:0, flashAmt:0, warn:0, dustAcc:0,
  streak(a, hold){ this.streakAmt = Math.max(this.streakAmt, a); this.streakHold = Math.max(this.streakHold, hold||0); },
  flash(a){ this.flashAmt = Math.max(this.flashAmt, a); },
  dustTrail(dt, speed){
    const rate = TUNING.fx.dustRun * clamp01((speed - 3.4)/(MV.topSpeed-3.4));
    this.dustAcc += rate*dt;
    while (this.dustAcc >= 1){
      this.dustAcc -= 1;
      const a = rnd()*PI2;
      /* belt advection is applied in Pool.step, so only the scuff velocity goes here */
      FX.dust.spawn(P.x + rndR(-0.26,0.26), 0.03, P.z + rndR(-0.05,0.30),
        Math.cos(a)*0.42 - P.vx*0.08, rndR(0.35,1.05), Math.sin(a)*0.42,
        rndR(0.11,0.18), rndR(0.28,0.44), rndR(0.15,0.26), 0.80,0.75,0.64, 0.30, 1.8, rndR(-2,2));
    }
  },
  step(dt){
    if (this.streakHold > 0) this.streakHold -= dt;
    else this.streakAmt = damp(this.streakAmt, 0, 5.0, dt);
    this.flashAmt = damp(this.flashAmt, 0, 9.0, dt);
    // hazard proximity: 0 at the start of the rear third, 1 at the lip
    const t = (Game.state === 'dead') ? 0.22 : clamp01(invLerp(HAZARD_Z, B.rear-0.6, P.z));
    this.warn = damp(this.warn, t, 8, dt);
    const spd = clamp01((Math.hypot(P.vx,P.vz)-MV.topSpeed*0.55)/(MV.topSpeed*0.45));
    this.streak(spd*TUNING.fx.streakSpeed, 0);
  },
};

/* =====================================================================================
   18. THE BELT — tiers on a curve, surges, stutters.
   ===================================================================================== */
const Belt = {
  base:B.tiers[0], speed:B.tiers[0], tier:0, dist:0, mult:1, multT:1,
  surgeNext:0, surgeState:0, surgeT:0,
  stutNext:0, stutState:0, stutT:0,
  scrollV:0,
  reset(){
    this.base=B.tiers[0]; this.speed=B.tiers[0]; this.tier=0; this.dist=0; this.mult=1; this.multT=1;
    this.surgeNext=rndR(B.surge.every[0],B.surge.every[1]); this.surgeState=0; this.surgeT=0;
    this.stutNext=rndR(B.stutter.every[0],B.stutter.every[1]); this.stutState=0; this.stutT=0;
  },
  get warning(){ return this.surgeState===1 || this.stutState===1; },
  get disturbed(){ return this.surgeState!==0; },
  step(dt){
    /* tier ladder — long plateaus, then a hard step up */
    let t = 0;
    for (let i=0;i<B.tierAt.length;i++) if (this.dist >= B.tierAt[i]) t = i;
    if (t !== this.tier){ this.tier = t; UI.tierUp(t); }
    const want = B.tiers[this.tier];
    const rate = Math.abs(want - this.base)/B.stepTime;
    this.base = moveTo(this.base, want, Math.max(rate, 1.2)*dt);

    /* surges: telegraphed, then a hard shove */
    const S = B.surge;
    if (this.surgeState===0){
      this.surgeNext -= dt;
      if (this.surgeNext <= 0 && this.dist > 140){ this.surgeState=1; this.surgeT=0; UI.surge(true); Sfx.klaxon(); }
    } else {
      this.surgeT += dt;
      if (this.surgeState===1 && this.surgeT >= S.warn){ this.surgeState=2; this.surgeT=0; Sfx.surge(); Fx.streak(TUNING.fx.streakSurge, 1.2); Cam.shake(1.4); }
      else if (this.surgeState===2 && this.surgeT >= S.ramp){ this.surgeState=3; this.surgeT=0; }
      else if (this.surgeState===3 && this.surgeT >= S.hold){ this.surgeState=4; this.surgeT=0; UI.surge(false); }
      else if (this.surgeState===4 && this.surgeT >= S.ease){
        this.surgeState=0; this.surgeNext=rndR(S.every[0],S.every[1]);
      }
    }
    /* stutters: the belt hiccups and an over-committed runner meets the front roller */
    const T = B.stutter;
    if (this.stutState===0){
      this.stutNext -= dt;
      if (this.stutNext <= 0 && this.dist > 320 && this.surgeState===0){ this.stutState=1; this.stutT=0; Sfx.stutterWarn(); }
    } else {
      this.stutT += dt;
      if (this.stutState===1 && this.stutT >= T.warn){ this.stutState=2; this.stutT=0; Sfx.stutter(); }
      else if (this.stutState===2 && this.stutT >= T.hold){ this.stutState=3; this.stutT=0; }
      else if (this.stutState===3 && this.stutT >= T.ease){ this.stutState=0; this.stutNext=rndR(T.every[0],T.every[1]); }
    }
    /* multiplier target */
    let m = 1;
    if (this.surgeState===2) m = lerp(1, S.mul, clamp01(this.surgeT/S.ramp));
    else if (this.surgeState===3) m = S.mul;
    else if (this.surgeState===4) m = lerp(S.mul, 1, clamp01(this.surgeT/S.ease));
    if (this.stutState===2) m *= lerp(1, T.mul, clamp01(this.stutT/0.10));
    else if (this.stutState===3) m *= T.mul;
    else if (this.stutState===0 && this.stutT>0) m *= 1;
    this.multT = m;
    this.mult = damp(this.mult, this.multT, this.stutState?26:14, dt);
    this.speed = this.base*this.mult;
    if (this.scoring) this.dist += this.speed*dt;

    /* belt surface actually moves under the feet */
    const off = TEX.belt.offset;
    off.y = (off.y + (this.speed*dt)/BELT_TILE) % 1;
    TEX.beltBump.offset.y = off.y;
    const spin = this.speed/0.92*dt;
    for (let i=0;i<world.rollers.length;i++) world.rollers[i].rotation.y += spin;
  },
};

/* =====================================================================================
   19. OBSTACLES — motion, spawning with a hard legibility guarantee, collision.
   ===================================================================================== */
const Threat = { active:false, dodgeDir:0, dist:99 };

const PATTERNS = [
  // tier: minimum belt tier this pattern may appear at
  { tier:0, items:[{t:OT.SWEEP, xN:0.0}] },
  { tier:0, items:[{t:OT.SWEEP, xN:-0.55}] },
  { tier:0, items:[{t:OT.SWEEP, xN: 0.55}] },
  { tier:0, items:[{t:OT.HIGH,  xN:0}] },
  { tier:1, items:[{t:OT.BUMP,  xN:-0.62},{t:OT.BUMP, xN:0.62}] },
  { tier:1, items:[{t:OT.SWEEP, xN:-0.62},{t:OT.SWEEP, xN:0.62}] },
  { tier:1, items:[{t:OT.SLICK, xN:0.0},{t:OT.HIGH, xN:0, dz:7.5}] },
  { tier:2, items:[{t:OT.PEND,  xN:0}] },
  { tier:2, items:[{t:OT.FAN,   xN:-0.45},{t:OT.BUMP, xN:0.70, dz:3.0}] },
  { tier:2, items:[{t:OT.HIGH,  xN:0},{t:OT.SWEEP, xN:0.0, dz:9.0}] },
  { tier:3, items:[{t:OT.FAN,   xN:0.0},{t:OT.SWEEP, xN:-0.70, dz:6.5},{t:OT.SWEEP, xN:0.70, dz:6.5}] },
  { tier:3, items:[{t:OT.PEND,  xN:0},{t:OT.SLICK, xN:-0.5, dz:6.0}] },
  { tier:3, items:[{t:OT.BUMP,  xN:-0.70},{t:OT.BUMP, xN:0.0},{t:OT.SWEEP, xN:0.70, dz:1.0}] },
  { tier:4, items:[{t:OT.HIGH,  xN:0},{t:OT.FAN, xN:0.5, dz:8.5},{t:OT.SLICK, xN:-0.4, dz:5.0}] },
  { tier:4, items:[{t:OT.FAN,   xN:-0.55},{t:OT.FAN, xN:0.55, dz:5.0}] },
  { tier:5, items:[{t:OT.PEND,  xN:0},{t:OT.SWEEP, xN:0.0, dz:7.0},{t:OT.BUMP, xN:-0.72, dz:12.0}] },
];

const Spawn = { gapLeft: 12, lastLead: 9.9, minLead: 99, blocked:0, count:0, patterns:0 };
function spawnZBase(){ return B.front - TUNING.obs.dropLead; }

function trySpawn(dt){
  if (Game.state !== 'play') return;
  Spawn.gapLeft -= Belt.speed*dt;
  if (Spawn.gapLeft > 0) return;
  if (Belt.disturbed){ Spawn.gapLeft = 2.0; return; }        // never spawn into a surge
  if (obsActive.length >= (inputMode==='touch' ? 8 : TUNING.obs.maxActive)){ Spawn.gapLeft = 3.0; return; }

  /* the legibility guarantee: measured against the worst-case closing speed */
  const sz = spawnZBase();
  const closing = Belt.speed + Math.max(0, -P.vz)*0.6;
  const lead = (P.z - sz)/closing;
  Spawn.lastLead = lead;
  if (lead < LIVE.legibility){ Spawn.gapLeft = 1.0; Spawn.blocked++; return; }

  const pool = [];
  for (let i=0;i<PATTERNS.length;i++) if (PATTERNS[i].tier <= Belt.tier) pool.push(PATTERNS[i]);
  const pat = pool[Math.floor(rnd()*pool.length)];
  Spawn.minLead = Math.min(Spawn.minLead, lead);
  Spawn.patterns++; Spawn.count += pat.items.length;
  spawnPattern(pat, sz, lead);
  const g = TUNING.obs.gapSeconds;
  Spawn.gapLeft = rndR(g[0], g[1])*Belt.speed * (1 + pat.items.length*0.16);
}

function spawnPattern(pat, sz, lead){
  for (let i=0;i<pat.items.length;i++){
    const it = pat.items[i], d = OBS_DEF[it.t];
    const o = getObstacle(it.t);
    o.alive = true; o.touched = false; o.scored = false; o.minDist = 99; o.dropT = 0;
    o.k = PLAY.latK;
    const margin = (d.hit.halfX + 0.3)*o.k;
    o.x = d.full ? 0 : clamp(it.xN*(PLAY.half - margin*0.55), -(PLAY.half-margin*0.6), PLAY.half-margin*0.6);
    o.z = sz - (it.dz||0);
    o.phase = rnd()*PI2;
    o.spin = rnd()*PI2;
    o.bx = 0; o.by = 0;
    if (it.t===OT.SWEEP){
      o.sweepAmp = (PLAY.half - margin)*rndR(0.35,0.95);
      o.sweepFreq = rndR(0.85, 1.65);
    }
    if (it.t===OT.PEND){ o.sweepAmp = rndR(0.62, 1.02); o.sweepFreq = rndR(1.05, 1.65); }
    if (it.t===OT.FAN){  o.sweepFreq = rndR(1.5, 2.7)*(rnd()>0.5?1:-1); }
    o.spawnLead = lead || 0;
    o.root.visible = true;
    o.root.scale.set(o.k, 1, 1);
    obsActive.push(o);
  }
}

function despawn(o){
  o.alive = false; o.root.visible = false;
  const i = obsActive.indexOf(o); if (i>=0) obsActive.splice(i,1);
}

/* separation distance between the player box and an axis-aligned obstacle box */
function boxSep(cx,halfX,y0,y1,cz,halfZ, px,py0,py1,pz,pr){
  const dx = Math.max(0, Math.abs(px-cx) - (halfX+pr));
  const dz = Math.max(0, Math.abs(pz-cz) - (halfZ+pr));
  const dy = Math.max(0, Math.max(y0-py1, py0-y1));
  return Math.hypot(dx,dy,dz);
}

function stepObstacles(dt){
  const dz = Belt.speed*dt;
  const proneH = DV.colliderH, standH = P.height;
  const prone = (P.state===ST.DIVE || P.state===ST.SLIDE || P.state===ST.RAG || P.state===ST.BLEND);
  const ph = prone ? proneH : standH;
  const py0 = P.y + 0.04, py1 = P.y + ph, pr = 0.44;
  const alive = P.alive && !P.dying;
  Threat.active = false; Threat.dist = 99;

  for (let i=obsActive.length-1;i>=0;i--){
    const o = obsActive[i], d = o.def;
    o.z += dz;
    if (o.dropT < 1){ o.dropT = Math.min(1, o.dropT + dt*2.6); }
    const dropY = (1-easeOutCubic(o.dropT))*TUNING.obs.dropHeight;

    /* ---- per-type motion ---- */
    if (d.sweep){
      o.phase += o.sweepFreq*dt;
      o.bx = Math.sin(o.phase)*o.sweepAmp;
    } else if (o.type===OT.PEND){
      o.phase += o.sweepFreq*dt;
      o.arm.rotation.z = Math.sin(o.phase)*o.sweepAmp;
    } else if (o.type===OT.FAN){
      o.spin += o.sweepFreq*dt;
      o.arm.rotation.z = o.spin;
    }
    o.root.position.set(o.x + o.bx, dropY, o.z);

    /* ---- collision + near-miss ---- */
    if (alive && o.dropT > 0.30){
      let sep = 99, hit = false;
      if (o.type===OT.PEND){
        const a = o.arm.rotation.z;
        const bxw = o.x + Math.sin(a)*d.armLen*o.k;
        const byw = d.pivotY - Math.cos(a)*d.armLen + dropY;
        const ex = (P.x - bxw)/Math.max(0.35,o.k);
        const pyc = clamp(byw, py0, py1);
        const ddy = byw - pyc;
        const dd = Math.hypot(ex, ddy, P.z - o.z);
        sep = Math.max(0, dd - (d.ballR + pr));
        if (dd < d.ballR + pr){
          hit = true;
          const vx = Math.cos(a)*d.armLen*o.sweepFreq*Math.cos(o.phase)*o.k;
          startRagdoll(vx*1.5 + Math.sign(P.x-bxw||1)*4.0, 5.6, 5.0 + Belt.speed*0.35, (P.x-bxw)*0.5, 0.5, 12 + Belt.speed);
        }
      } else if (o.type===OT.FAN){
        const zGap = Math.abs(P.z - o.z) - (d.bladeHalf + pr);
        sep = Math.max(0, zGap);
        if (zGap < 0){
          for (let b=0;b<3 && !hit;b++){
            const a = o.spin + b*PI2/3;
            for (let s=0;s<5;s++){
              const t = 0.12 + s*0.22;
              const bxw = o.x + Math.sin(a)*d.bladeR*t*o.k;
              const byw = d.hubY + Math.cos(a)*d.bladeR*t + dropY;
              const dxx = Math.max(0, Math.abs(P.x-bxw) - (0.28*o.k + pr));
              const dyy = Math.max(0, Math.max(byw-py1, py0-byw) - 0.28);
              const dd = Math.hypot(dxx,dyy);
              sep = Math.min(sep, dd);
              if (dd <= 0.001){ hit = true;
                startRagdoll(Math.sign(P.x-o.x||1)*5.0, 7.4, 6.5 + Belt.speed*0.4, (P.x-o.x)*0.4, 0.6, 14 + Belt.speed);
                break;
              }
            }
          }
        }
      } else {
        const cx = o.x + o.bx, hx = d.hit.halfX*o.k, hz = d.hit.halfZ;
        const y0 = d.hit.y0 + dropY, y1 = d.hit.y1 + dropY;
        sep = boxSep(cx,hx,y0,y1,o.z,hz, P.x,py0,py1,P.z,pr);
        if (sep <= 0.0001){
          if (d.slick){
            P.slickT = 0.22;
            if (rnd() < dt*10) burstDust(P.x, 0.05, P.z, 0.25, 1.4, '#bfeaff');
          } else if (d.bouncy){
            const closing = -(P.vz + beltDragNow());
            hit = true;
            if (prone && Math.hypot(P.vx,P.vz) > MV.topSpeed*0.9){
              startRagdoll(Math.sign(P.x-cx||1)*3.0, 6.2, 8.0, 0, 0.3, 11);
            } else {
              P.vz = Math.abs(closing)*0.55 + 6.4;
              P.vy = Math.max(P.vy, 5.6);
              P.vx += Math.sign(P.x-cx||1)*2.6;
              P.grounded = false; P.state = ST.RUN;
              squashTo(1.20, 0.84);
              Cam.shake(2.0); Sfx.bounce(0.8); Fx.flash(0.22);
              burstDust(P.x, 0.7, P.z, 0.7, 1.5, '#d6fff0');
              o.touched = true;
            }
          } else {
            hit = true;
            const lat = (o.type===OT.SWEEP) ? Math.cos(o.phase)*o.sweepFreq*o.sweepAmp*1.4 : 0;
            const up  = (o.type===OT.SWEEP) ? 7.0 : 5.0;
            startRagdoll(lat + rndR(-1.5,1.5), up, 6.0 + Belt.speed*0.42, (P.x-cx)*0.5, 0.55, 12 + Belt.speed);
          }
        }
      }
      if (hit) o.touched = true;
      if (sep < o.minDist) o.minDist = sep;

      /* threat scan for the silent dodge assist (touch only) */
      if (!d.full && !d.slick && o.z < P.z - 0.5){
        const tSec = (P.z - o.z)/Math.max(4, Belt.speed);
        if (tSec < 0.85 && tSec < Threat.dist){
          const cx = o.x + o.bx;
          if (Math.abs(P.x - cx) < (d.hit.halfX*o.k + LIVE.nearMissR + 0.6)){
            Threat.dist = tSec; Threat.active = true;
            Threat.dodgeDir = Math.sign(P.x - cx) || 1;
          }
        }
      }
    }

    /* ---- passed the player: award the near miss ---- */
    if (!o.scored && o.z > P.z + 1.1){
      o.scored = true;
      if (!o.touched && !o.def.slick && o.minDist < LIVE.nearMissR && o.minDist > 0.0002){
        Score.nearMiss(o.x + o.bx, o.z);
      }
    }
    if (o.z > B.rear + 4.5) despawn(o);
  }
  trySpawn(dt);
}

/* =====================================================================================
   20. CAMERA — critically damped springs, separate stiffness for position and look-at.
   ===================================================================================== */
const CM = TUNING.cam;
const Cam = {
  px:0, py:7, pz:0, vpx:0, vpy:0, vpz:0,
  lx:0, ly:1, lz:0, vlx:0, vly:0, vlz:0,
  fov:CM.fovBase, fovV:0, shakeA:0, shakeT:0, dip:0, dipV:0, hs:0, t:0,
  reset(){
    const o = PLAY.portrait ? CM.offPort : CM.offLand;
    this.px = P.x + o[0]; this.py = o[1]; this.pz = P.z + o[2];
    this.vpx=this.vpy=this.vpz=0; this.vlx=this.vly=this.vlz=0;
    this.lx = P.x; this.ly = 1; this.lz = P.z;
    this.fov = CM.fovBase; this.fovV=0; this.shakeA=0; this.dip=0; this.dipV=0; this.hs=0;
  },
  hitStop(t){ this.hs = Math.max(this.hs, t); },
  shake(a){ this.shakeA = Math.min(CM.shakeMax, this.shakeA + a*CM.shakePerImpulse*10); },
  dipKick(a){ this.dipV -= a*CM.landDip*26; },
  step(dt, p){
    this.t += dt;
    const port = PLAY.portrait;
    const o = port ? CM.offPort : CM.offLand;
    const hz = clamp01(invLerp(HAZARD_Z-2, B.rear, p.z));
    const py = clamp(p.y, -1.6, 7.0);          // a body in the pit must not drag the camera down
    const tx = p.x*0.62 + o[0];
    const ty = o[1] + py*0.34;
    const tz = p.z + o[2] + hz*CM.hazardPull;

    spring(this,'px','vpx', tx, CM.posFreq, dt);
    spring(this,'py','vpy', ty, CM.posFreq*1.15, dt);
    spring(this,'pz','vpz', tz, CM.posFreq, dt);

    /* look target leads the motion; softer spring so the camera trails the body */
    const lead = CM.lead;
    spring(this,'lx','vlx', p.x + P.vx*lead*0.5, CM.lookFreq, dt);
    spring(this,'ly','vly', (port?CM.lookYPort:CM.lookYLand) + py*0.55, CM.lookFreq, dt);
    spring(this,'lz','vlz', p.z + clamp((P.vz + Belt.speed*0.18)*lead*0.55, -1.6, 1.6), CM.lookFreq, dt);

    /* fov kick */
    let f = lerp(CM.fovBase, LIVE.fovTop, Math.pow(clamp01(p.speedN),1.25));
    if (P.state===ST.DIVE) f = Math.max(f, port ? CM.fovDive-5 : CM.fovDive);
    if (Belt.surgeState>=2 && Belt.surgeState<=3) f += 3.0;
    this.fov = damp(this.fov, f, CM.fovEase, dt);

    /* springs for the landing dip and the impact shake */
    this.dipV += (-this.dip*260 - this.dipV*24)*dt; this.dip += this.dipV*dt;
    this.shakeA *= Math.exp(-CM.shakeDecay*dt);
    if (this.shakeA < 0.0008) this.shakeA = 0;
  },
  apply(){
    camera.position.set(this.px, this.py + this.dip, this.pz);
    camera.up.set(0,1,0);
    camera.lookAt(this.lx, this.ly + this.dip*0.6, this.lz);
    const s = this.shakeA * LIVE.shakeScale * (Settings.shake ? 1 : 0);
    if (s > 0){
      const t = this.t*CM.shakeFreq;
      _v1.set(1,0,0).applyQuaternion(camera.quaternion);
      _v2.set(0,1,0).applyQuaternion(camera.quaternion);
      camera.position.addScaledVector(_v1, Math.sin(t)*s).addScaledVector(_v2, Math.sin(t*1.41+1.3)*s*0.78);
      camera.rotateZ(Math.sin(t*0.79)*s*0.045);
    }
    if (Math.abs(camera.fov - this.fov) > 0.01){ camera.fov = this.fov; camera.updateProjectionMatrix(); }
    camera.updateMatrixWorld();
  },
};

/* =====================================================================================
   21. POST — bright pass, separable blur, one composite doing ACES + streaks + vignette.
   No hazy wash: the threshold is high so only real highlights bloom.
   ===================================================================================== */
const fsQuadGeo = new THREE.BufferGeometry();
fsQuadGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array([-1,-1,0, 3,-1,0, -1,3,0]),3));
fsQuadGeo.setAttribute('uv', new THREE.BufferAttribute(new Float32Array([0,0, 2,0, 0,2]),2));
const VS_FS = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`;
const quadScene = new THREE.Scene();
const quadCam = new THREE.Camera();
const quadMesh = new THREE.Mesh(fsQuadGeo, null);
quadMesh.frustumCulled = false; quadScene.add(quadMesh);

const Post = {
  rt:null, rtA:null, rtB:null, w:1, h:1, bloomLevels:2, samples:4, type:THREE.HalfFloatType,
  init(){
    const half = renderer.extensions.has('EXT_color_buffer_half_float') || renderer.extensions.has('EXT_color_buffer_float');
    this.type = half ? THREE.HalfFloatType : THREE.UnsignedByteType;
    this.mBright = new THREE.ShaderMaterial({
      uniforms:{ tD:{value:null}, uTexel:{value:new THREE.Vector2()}, uThr:{value:TUNING.fx.bloomThreshold}, uKnee:{value:0.42} },
      vertexShader:VS_FS, depthTest:false, depthWrite:false,
      fragmentShader:`
        varying vec2 vUv; uniform sampler2D tD; uniform vec2 uTexel; uniform float uThr,uKnee;
        void main(){
          vec3 c = texture2D(tD, vUv + uTexel*vec2(-0.5,-0.5)).rgb;
          c += texture2D(tD, vUv + uTexel*vec2( 0.5,-0.5)).rgb;
          c += texture2D(tD, vUv + uTexel*vec2(-0.5, 0.5)).rgb;
          c += texture2D(tD, vUv + uTexel*vec2( 0.5, 0.5)).rgb;
          c *= 0.25;
          float l = max(c.r, max(c.g, c.b));
          float k = smoothstep(uThr, uThr + uKnee, l);
          gl_FragColor = vec4(c * k, 1.0);
        }`,
    });
    this.mBlur = new THREE.ShaderMaterial({
      uniforms:{ tD:{value:null}, uDir:{value:new THREE.Vector2()} },
      vertexShader:VS_FS, depthTest:false, depthWrite:false,
      fragmentShader:`
        varying vec2 vUv; uniform sampler2D tD; uniform vec2 uDir;
        void main(){
          vec3 s = texture2D(tD, vUv).rgb * 0.2270270270;
          s += texture2D(tD, vUv + uDir*1.3846153846).rgb * 0.3162162162;
          s += texture2D(tD, vUv - uDir*1.3846153846).rgb * 0.3162162162;
          s += texture2D(tD, vUv + uDir*3.2307692308).rgb * 0.0702702703;
          s += texture2D(tD, vUv - uDir*3.2307692308).rgb * 0.0702702703;
          gl_FragColor = vec4(s, 1.0);
        }`,
    });
    this.mComp = new THREE.ShaderMaterial({
      uniforms:{
        tD:{value:null}, tB:{value:null},
        uBloom:{value:TUNING.fx.bloomStrength}, uVig:{value:TUNING.fx.vignette},
        uStreak:{value:0.0}, uWarn:{value:0.0}, uFlash:{value:0.0}, uExp:{value:0.86}, uBloomOn:{value:1.0},
      },
      vertexShader:VS_FS, depthTest:false, depthWrite:false,
      fragmentShader:`
        varying vec2 vUv;
        uniform sampler2D tD, tB;
        uniform float uBloom, uVig, uStreak, uWarn, uFlash, uExp, uBloomOn;
        vec3 aces(vec3 x){
          return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14), 0.0, 1.0);
        }
        vec3 lin2srgb(vec3 c){
          return mix(pow(c, vec3(0.41666))*1.055 - 0.055, c*12.92, step(c, vec3(0.0031308)));
        }
        void main(){
          vec2 d = vUv - 0.5;
          vec3 base = texture2D(tD, vUv).rgb;
          if (uStreak > 0.002){
            vec3 acc = base; float wsum = 1.0;
            for (int i=1;i<7;i++){
              float f = float(i)/7.0;
              float sc = 1.0 - f*0.085*uStreak;
              float w = 1.0 - f*0.7;
              acc += texture2D(tD, 0.5 + d*sc).rgb * w; wsum += w;
            }
            base = mix(base, acc/wsum, clamp(uStreak*1.35, 0.0, 0.85));
          }
          vec3 c = base + texture2D(tB, vUv).rgb * uBloom * uBloomOn;
          c += vec3(1.0,0.92,0.82)*uFlash;
          float v = smoothstep(1.06, 0.30, length(d*vec2(1.05,1.0)));
          c *= mix(1.0, v, uVig);
          float band = smoothstep(0.40, 0.98, length(d*vec2(1.02,1.0)));
          c = mix(c, c*vec3(1.80,0.44,0.36), uWarn*0.50*band);
          gl_FragColor = vec4(lin2srgb(aces(c*uExp)), 1.0);
        }`,
    });
  },
  resize(w,h){
    this.w=w; this.h=h;
    const opt = { type:this.type, colorSpace:THREE.LinearSRGBColorSpace,
      minFilter:THREE.LinearFilter, magFilter:THREE.LinearFilter, depthBuffer:true, stencilBuffer:false, samples:this.samples };
    if (this.rt) this.rt.dispose();
    this.rt = new THREE.WebGLRenderTarget(w,h,opt);
    const hw = Math.max(2, Math.floor(w/2)), hh = Math.max(2, Math.floor(h/2));
    const bopt = { type:this.type, colorSpace:THREE.LinearSRGBColorSpace,
      minFilter:THREE.LinearFilter, magFilter:THREE.LinearFilter, depthBuffer:false, stencilBuffer:false };
    if (this.rtA) this.rtA.dispose();
    if (this.rtB) this.rtB.dispose();
    this.rtA = new THREE.WebGLRenderTarget(hw,hh,bopt);
    this.rtB = new THREE.WebGLRenderTarget(hw,hh,bopt);
  },
  pass(mat, target){
    quadMesh.material = mat;
    renderer.setRenderTarget(target);
    renderer.render(quadScene, quadCam);
  },
  render(){
    renderer.setRenderTarget(this.rt);
    renderer.render(scene, camera);
    DBG.sceneCalls = renderer.info.render.calls;
    DBG.tris = renderer.info.render.triangles;

    const on = this.bloomLevels > 0;
    if (on){
      const hw = this.rtA.width, hh = this.rtA.height;
      this.mBright.uniforms.tD.value = this.rt.texture;
      this.mBright.uniforms.uTexel.value.set(1/this.w, 1/this.h);
      this.pass(this.mBright, this.rtA);
      const r = TUNING.fx.bloomRadius;
      for (let i=0;i<this.bloomLevels;i++){
        const sc = r*(1+i*1.9);
        this.mBlur.uniforms.tD.value = this.rtA.texture;
        this.mBlur.uniforms.uDir.value.set(sc/hw, 0);
        this.pass(this.mBlur, this.rtB);
        this.mBlur.uniforms.tD.value = this.rtB.texture;
        this.mBlur.uniforms.uDir.value.set(0, sc/hh);
        this.pass(this.mBlur, this.rtA);
      }
    }
    const u = this.mComp.uniforms;
    u.tD.value = this.rt.texture;
    u.tB.value = this.rtA.texture;
    u.uBloomOn.value = on ? 1 : 0;
    u.uStreak.value = clamp01(Fx.streakAmt);
    u.uWarn.value = Fx.warn;
    u.uFlash.value = Fx.flashAmt*0.5;
    this.pass(this.mComp, null);
  },
};
Post.init();

/* =====================================================================================
   22. AUDIO — procedural, created inside the first gesture so iOS never hands us a
   dead context. Nothing is allocated per frame.
   ===================================================================================== */
const Sfx = {
  ctx:null, master:null, noise:null, on:true, ready:false,
  beltG:null, beltF:null, beltOsc:null, beltOscG:null, warnOsc:null, warnG:null, rumbleG:null, rumbleF:null,
  ensure(){
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { this.ctx = new AC({ latencyHint:'interactive' }); } catch(e){ return; }
    const c = this.ctx;
    this.master = c.createGain(); this.master.gain.value = 0.0; this.master.connect(c.destination);
    /* one noise buffer, reused by every noise voice for the whole session */
    const len = Math.floor(c.sampleRate*1.2);
    this.noise = c.createBuffer(1, len, c.sampleRate);
    const d = this.noise.getChannelData(0);
    let lp = 0;
    for (let i=0;i<len;i++){ const w = Math.random()*2-1; lp = lp*0.72 + w*0.28; d[i] = w*0.7 + lp*0.6; }

    /* continuous belt bed */
    const bs = c.createBufferSource(); bs.buffer = this.noise; bs.loop = true;
    this.beltF = c.createBiquadFilter(); this.beltF.type='lowpass'; this.beltF.frequency.value=420; this.beltF.Q.value=0.9;
    this.beltG = c.createGain(); this.beltG.gain.value = 0.0;
    bs.connect(this.beltF); this.beltF.connect(this.beltG); this.beltG.connect(this.master); bs.start();
    this.beltOsc = c.createOscillator(); this.beltOsc.type='sawtooth'; this.beltOsc.frequency.value=54;
    this.beltOscG = c.createGain(); this.beltOscG.gain.value=0.0;
    const bf = c.createBiquadFilter(); bf.type='lowpass'; bf.frequency.value=180;
    this.beltOsc.connect(bf); bf.connect(this.beltOscG); this.beltOscG.connect(this.master); this.beltOsc.start();

    /* surge rumble */
    const rs = c.createBufferSource(); rs.buffer = this.noise; rs.loop = true;
    this.rumbleF = c.createBiquadFilter(); this.rumbleF.type='lowpass'; this.rumbleF.frequency.value=110;
    this.rumbleG = c.createGain(); this.rumbleG.gain.value=0;
    rs.connect(this.rumbleF); this.rumbleF.connect(this.rumbleG); this.rumbleG.connect(this.master); rs.start();

    /* hazard warning tone, always running, gated by gain */
    this.warnOsc = c.createOscillator(); this.warnOsc.type='square'; this.warnOsc.frequency.value=440;
    this.warnG = c.createGain(); this.warnG.gain.value = 0;
    const wf = c.createBiquadFilter(); wf.type='bandpass'; wf.frequency.value=900; wf.Q.value=1.2;
    this.warnOsc.connect(wf); wf.connect(this.warnG); this.warnG.connect(this.master); this.warnOsc.start();
    this.ready = true;
  },
  resume(){
    this.ensure();
    if (!this.ctx) return;
    if (this.ctx.state !== 'running') this.ctx.resume();
    this.master.gain.setTargetAtTime(this.on ? 0.85 : 0.0, this.ctx.currentTime, 0.08);
  },
  setOn(v){ this.on = v; if (this.ctx) this.master.gain.setTargetAtTime(v?0.85:0.0, this.ctx.currentTime, 0.05); },
  /* ---- per-frame parameter drive (no node creation) ---- */
  drive(){
    if (!this.ready) return;
    const spN = clamp01(Belt.speed/18);
    this.beltG.gain.value = 0.030 + spN*0.075;
    this.beltF.frequency.value = 320 + spN*1500;
    this.beltOscG.gain.value = 0.020 + spN*0.045;
    this.beltOsc.frequency.value = 40 + spN*34;
    this.rumbleG.gain.value = (Belt.surgeState===1 ? 0.10*clamp01(Belt.surgeT/B.surge.warn) : 0) +
                              (Belt.surgeState>=2 && Belt.surgeState<=3 ? 0.16 : 0);
    const w = Fx.warn;
    this.warnG.gain.value = w>0.03 ? 0.05*w*(0.55+0.45*Math.sin(this.ctx.currentTime*(9+w*22))) : 0;
    this.warnOsc.frequency.value = 380 + w*520;
  },
  /* ---- one-shots ---- */
  blip(type, f0, f1, t, gain, dur, filt){
    if (!this.ready || !this.on) return;
    const c = this.ctx, n = c.currentTime;
    const o = c.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(f0, n);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20,f1), n+dur);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, n);
    g.gain.exponentialRampToValueAtTime(gain, n+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, n+dur);
    let last = g;
    if (filt){ const bf = c.createBiquadFilter(); bf.type='lowpass'; bf.frequency.value=filt; g.connect(bf); last = bf; }
    o.connect(g); last.connect(this.master);
    o.start(n); o.stop(n+dur+0.02);
  },
  burst(dur, gain, f0, f1, type){
    if (!this.ready || !this.on) return;
    const c = this.ctx, n = c.currentTime;
    const s = c.createBufferSource(); s.buffer = this.noise;
    s.playbackRate.value = 0.8 + Math.random()*0.5;
    const f = c.createBiquadFilter(); f.type = type||'bandpass';
    f.frequency.setValueAtTime(f0, n); f.frequency.exponentialRampToValueAtTime(Math.max(60,f1), n+dur); f.Q.value = 0.8;
    const g = c.createGain();
    g.gain.setValueAtTime(gain, n); g.gain.exponentialRampToValueAtTime(0.0001, n+dur);
    s.connect(f); f.connect(g); g.connect(this.master);
    s.start(n, Math.random()*0.4); s.stop(n+dur+0.02);
  },
  jump(){ this.blip('sine', 300, 620, 0, 0.16, 0.13); this.burst(0.10, 0.10, 900, 300); },
  land(i){ this.blip('sine', 190, 70, 0, 0.10+0.16*i, 0.13, 500); this.burst(0.13, 0.06+0.10*i, 700, 180); },
  thud(i){ this.blip('sine', 130, 55, 0, 0.10+0.12*i, 0.16, 380); },
  dive(){ this.burst(0.34, 0.16, 380, 2600, 'bandpass'); this.blip('triangle', 200, 520, 0, 0.10, 0.22); },
  slide(){ this.burst(0.55, 0.14, 1500, 320, 'bandpass'); },
  bounce(i){ this.blip('sine', 160, 460, 0, 0.14+i*0.10, 0.17); this.blip('triangle', 620, 260, 0, 0.07, 0.12); },
  bonk(i){ this.blip('square', 190, 58, 0, 0.14+i*0.14, 0.24, 900); this.burst(0.26, 0.14+i*0.12, 1500, 200); },
  chime(n){ const f = 660*Math.pow(1.1892, Math.min(n,7)); this.blip('triangle', f, f*1.5, 0, 0.11, 0.20); },
  tier(){ for (let i=0;i<3;i++) setTimeout(()=>this.blip('triangle', 520*Math.pow(1.26,i), 520*Math.pow(1.26,i)*1.4, 0, 0.12, 0.20), i*95); },
  klaxon(){
    if (!this.ready || !this.on) return;
    for (let i=0;i<4;i++) setTimeout(()=>{ this.blip('square', i%2?520:400, i%2?520:400, 0, 0.10, 0.16, 1400); }, i*185);
  },
  surge(){ this.blip('sawtooth', 90, 260, 0, 0.16, 0.4, 900); this.burst(0.45, 0.18, 200, 2200); },
  stutterWarn(){ this.blip('square', 300, 300, 0, 0.07, 0.07, 1200); },
  stutter(){ this.blip('sawtooth', 220, 60, 0, 0.14, 0.28, 700); },
  death(){ this.blip('sawtooth', 260, 40, 0, 0.22, 0.85, 800); this.burst(0.7, 0.2, 1800, 120); },
};
