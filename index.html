<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#2f7fd8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>BELT RUNNER</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2337455e'/%3E%3Cellipse cx='16' cy='15' rx='8' ry='9.5' fill='%23ffcf3d'/%3E%3Ccircle cx='13' cy='13' r='1.7' fill='%23181233'/%3E%3Ccircle cx='19' cy='13' r='1.7' fill='%23181233'/%3E%3Crect x='5' y='25' width='22' height='3' rx='1.5' fill='%233fe0b0'/%3E%3C/svg%3E">
<style>
  :root{
    --sun:#ffcf3d; --blossom:#ff5c7a; --plum:#4b3a6b; --slate:#37455e;
    --mint:#3fe0b0; --ember:#ff7a29;
    --ink:#141a2a; --panel:rgba(16,22,38,.60); --edge:rgba(255,255,255,.16);
    --font: ui-rounded, "Arial Rounded MT Bold", "Nunito", "Trebuchet MS", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
    --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  }
  *,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    margin:0;padding:0;width:100%;height:100%;
    overflow:hidden;overscroll-behavior:none;-webkit-overflow-scrolling:auto;
    background:#0d1220;color:#fff;font-family:var(--font);font-weight:800;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
    touch-action:none;position:fixed;inset:0;
  }
  #app{position:fixed;inset:0;height:100dvh;height:var(--app-h,100dvh);width:100%;touch-action:none;overflow:hidden}
  #gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}

  /* ---------- HUD ---------- */
  #hud{position:absolute;inset:0;pointer-events:none;z-index:5}
  .panel{
    background:var(--panel);border:2px solid var(--edge);border-radius:18px;
    backdrop-filter:blur(10px) saturate(1.2);-webkit-backdrop-filter:blur(10px) saturate(1.2);
    box-shadow:0 8px 22px rgba(0,0,0,.34), inset 0 2px 0 rgba(255,255,255,.10);
  }
  .lbl{font-size:11px;letter-spacing:.16em;opacity:.72;font-weight:900;text-transform:uppercase;line-height:1}
  .num{font-variant-numeric:tabular-nums;font-weight:900;line-height:.94;letter-spacing:-.01em;
       text-shadow:0 3px 0 rgba(0,0,0,.28)}

  #scoreBox{position:absolute;left:calc(14px + var(--sal));top:calc(12px + var(--sat));
    padding:9px 15px 11px;min-width:132px;transform-origin:left top;will-change:transform}
  #score{font-size:40px;color:#fff}
  #scoreSub{margin-top:5px;display:flex;gap:10px;align-items:baseline}
  #best{font-size:13px;color:var(--sun);font-weight:900}

  #tierBox{position:absolute;left:50%;top:calc(12px + var(--sat));transform:translateX(-50%);
    padding:8px 14px 10px;text-align:center;min-width:150px;transform-origin:top center;will-change:transform}
  #tierNum{font-size:20px;color:var(--mint)}
  #speedBar{margin-top:6px;height:9px;border-radius:6px;background:rgba(0,0,0,.42);overflow:hidden;
    box-shadow:inset 0 2px 4px rgba(0,0,0,.4)}
  #speedFill{height:100%;width:12%;border-radius:6px;
    background:linear-gradient(90deg,var(--mint),var(--sun) 62%,var(--ember));transition:none}

  #btnRow{position:absolute;right:calc(12px + var(--sar));top:calc(12px + var(--sat));display:flex;gap:8px;pointer-events:auto}
  .iconBtn{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:19px;
    background:var(--panel);border:2px solid var(--edge);color:#fff;cursor:pointer;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-family:var(--font);font-weight:900;
    box-shadow:0 6px 16px rgba(0,0,0,.3), inset 0 2px 0 rgba(255,255,255,.10);transition:transform .09s ease}
  .iconBtn:active{transform:scale(.9)}

  #surge{position:absolute;left:50%;top:calc(96px + var(--sat));transform:translate(-50%,-14px) scale(.8);
    padding:8px 20px 10px;border-radius:16px;background:rgba(255,58,58,.24);border:2px solid rgba(255,120,90,.65);
    color:#fff;font-size:17px;letter-spacing:.2em;opacity:0;will-change:transform,opacity;
    box-shadow:0 0 30px rgba(255,80,40,.5), inset 0 2px 0 rgba(255,255,255,.14)}

  #popWrap{position:absolute;left:0;top:0;width:100%;height:100%}
  .pop{position:absolute;font-size:22px;font-weight:900;color:var(--mint);opacity:0;
    text-shadow:0 3px 0 rgba(0,0,0,.35);white-space:nowrap;will-change:transform,opacity}

  #vig{position:absolute;inset:0;opacity:0;
    background:radial-gradient(ellipse 78% 62% at 50% 52%, rgba(255,40,40,0) 46%, rgba(255,32,26,.92) 100%)}

  /* ---------- centre cards ---------- */
  #cards{position:absolute;inset:0;display:grid;place-items:center;z-index:7;pointer-events:none}
  .card{position:absolute;padding:26px 32px 28px;text-align:center;max-width:min(86vw,470px);
    opacity:0;transform:scale(.82);will-change:transform,opacity;pointer-events:none}
  .card.on{pointer-events:auto}
  .title{font-size:clamp(38px,10.5vw,66px);line-height:.9;letter-spacing:-.02em;margin:0 0 4px;
    background:linear-gradient(180deg,#fff 34%,var(--sun));-webkit-background-clip:text;background-clip:text;
    color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 4px 0 rgba(0,0,0,.3))}
  .sub{font-size:13.5px;letter-spacing:.06em;opacity:.9;margin:8px 0 0;line-height:1.55}
  @media (max-width:430px){ .card{padding:22px 20px 24px;max-width:92vw} .sub{font-size:12px} .keys{font-size:10.5px} }
  .keys{margin-top:14px;font-size:11.5px;letter-spacing:.08em;opacity:.72;line-height:1.85}
  kbd{background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.22);border-bottom-width:3px;
    border-radius:7px;padding:2px 7px;font-family:var(--font);font-weight:900;font-size:11px}
  .big{font-size:clamp(50px,14vw,86px);color:var(--sun)}
  .btn{margin-top:18px;display:inline-block;padding:14px 30px;border-radius:17px;font-size:17px;letter-spacing:.12em;
    background:linear-gradient(180deg,var(--mint),#1fae86);color:#0a2b22;border:none;border-bottom:5px solid #148568;
    font-family:var(--font);font-weight:900;cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,.34)}
  .btn:active{transform:translateY(3px);border-bottom-width:2px}
  .btn.alt{background:linear-gradient(180deg,#8fa4c8,#5f7397);color:#0d1526;border-bottom-color:#455a7d}

  /* ---------- settings ---------- */
  #settings{position:absolute;inset:0;display:grid;place-items:center;z-index:9;pointer-events:none;
    background:rgba(6,10,20,0);transition:background .18s ease}
  #settings.on{pointer-events:auto;background:rgba(6,10,20,.55)}
  #setCard{padding:22px 24px;min-width:min(88vw,340px);opacity:0;transform:scale(.86);will-change:transform,opacity}
  .row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 2px;
    border-bottom:1.5px solid rgba(255,255,255,.10);font-size:14px}
  .row:last-of-type{border-bottom:none}
  .toggle{width:60px;height:32px;border-radius:16px;background:rgba(0,0,0,.45);border:2px solid var(--edge);
    position:relative;cursor:pointer;flex:0 0 auto;transition:background .16s ease}
  .toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;
    background:#cbd6ea;transition:transform .18s cubic-bezier(.34,1.7,.5,1), background .16s ease}
  .toggle[data-on="1"]{background:rgba(63,224,176,.34);border-color:rgba(63,224,176,.7)}
  .toggle[data-on="1"]::after{transform:translateX(28px);background:var(--mint)}
  .seg{display:flex;gap:5px;flex:0 0 auto}
  .seg > div{padding:8px 11px;border-radius:11px;background:rgba(0,0,0,.34);border:2px solid transparent;
    font-size:11.5px;letter-spacing:.06em;cursor:pointer}
  .seg > div[data-on="1"]{background:rgba(255,207,61,.22);border-color:rgba(255,207,61,.75);color:var(--sun)}

  /* ---------- touch pad ring ---------- */
  #pad{position:absolute;left:0;top:0;width:96px;height:96px;margin:-48px 0 0 -48px;opacity:0;
    border-radius:50%;border:3px solid rgba(255,255,255,.30);background:radial-gradient(circle,rgba(255,255,255,.13),rgba(255,255,255,0) 70%);
    will-change:transform,opacity;transition:opacity .08s linear;z-index:6;pointer-events:none}
  #knob{position:absolute;left:0;top:0;width:42px;height:42px;margin:-21px 0 0 -21px;opacity:0;border-radius:50%;
    background:radial-gradient(circle at 38% 34%,rgba(255,255,255,.95),rgba(190,210,240,.66) 60%,rgba(150,175,215,.34));
    box-shadow:0 4px 12px rgba(0,0,0,.32);will-change:transform,opacity;transition:opacity .08s linear;z-index:6;pointer-events:none}
  #actFx{position:absolute;left:0;top:0;width:70px;height:70px;margin:-35px 0 0 -35px;opacity:0;border-radius:50%;
    border:3px solid rgba(63,224,176,.85);will-change:transform,opacity;z-index:6;pointer-events:none}

  /* ---------- debug ---------- */
  #dbg{position:absolute;left:calc(12px + var(--sal));top:calc(92px + var(--sat));padding:9px 12px;border-radius:13px;
    background:rgba(0,0,0,.62);border:1.5px solid rgba(255,255,255,.16);font-size:11px;line-height:1.6;
    font-variant-numeric:tabular-nums;letter-spacing:.02em;display:none;white-space:pre;z-index:8;color:#c9f7e6}
  #dbg.on{display:block}

  #hint{position:absolute;left:50%;bottom:calc(14px + var(--sab));transform:translateX(-50%);
    font-size:10.5px;letter-spacing:.07em;opacity:.55;text-align:center;line-height:1.5;
    white-space:nowrap;text-shadow:0 2px 6px rgba(0,0,0,.7);transition:opacity .5s ease}

  @media (max-width: 600px){
    #score{font-size:32px}
    #scoreBox{min-width:104px;padding:7px 12px 9px}
    #tierBox{min-width:112px;padding:6px 10px 8px}
    #tierNum{font-size:17px}
    #speedBar{height:7px}
    .iconBtn{width:42px;height:42px;font-size:17px}
    #surge{top:calc(84px + var(--sat));font-size:15px;padding:7px 16px 9px}
  }
  @media (max-width: 380px){ #score{font-size:27px} #scoreBox{min-width:92px} #tierBox{min-width:96px} }
  #boot{position:absolute;inset:0;display:grid;place-items:center;background:#0d1220;z-index:20;
    text-align:center;font-size:14px;letter-spacing:.14em;transition:opacity .4s ease}
  #boot .sp{width:34px;height:34px;margin:0 auto 16px;border-radius:50%;
    border:4px solid rgba(255,255,255,.18);border-top-color:var(--sun);animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #boot.gone{opacity:0;pointer-events:none}
  #bootMsg{max-width:74vw;line-height:1.7;font-size:12.5px;opacity:.8}
</style>

<body>
<div id="app">
  <canvas id="gl"></canvas>

  <div id="hud">
    <div id="vig"></div>

    <div id="scoreBox" class="panel">
      <div class="lbl">Distance</div>
      <div id="score" class="num">0</div>
      <div id="scoreSub"><span class="lbl">Best</span><span id="best" class="num">0</span></div>
    </div>

    <div id="tierBox" class="panel">
      <div class="lbl">Belt Tier</div>
      <div id="tierNum" class="num">1</div>
      <div id="speedBar"><div id="speedFill"></div></div>
    </div>

    <div id="btnRow">
      <div id="btnSet" class="iconBtn" role="button" aria-label="Settings">⚙</div>
    </div>

    <div id="surge" class="num">SURGE</div>
    <div id="popWrap"></div>
    <div id="hint"></div>
  </div>

  <div id="pad"></div><div id="knob"></div><div id="actFx"></div>

  <div id="cards">
    <div id="cardStart" class="card panel">
      <h1 class="title">BELT<br>RUNNER</h1>
      <p class="sub">The belt wants you off the back.<br>Out-run it.</p>
      <div class="keys" id="startKeys"></div>
      <button class="btn" id="btnPlay">START</button>
    </div>

    <div id="cardDead" class="card panel">
      <div class="lbl">Run Over</div>
      <div id="deadScore" class="num big">0</div>
      <div class="sub" id="deadSub">&nbsp;</div>
      <button class="btn" id="btnAgain">RUN AGAIN</button>
    </div>
  </div>

  <div id="settings">
    <div id="setCard" class="panel">
      <div class="lbl" style="margin-bottom:6px">Settings</div>
      <div class="row"><span>Auto-run</span><div class="toggle" id="tgAuto" data-on="0"></div></div>
      <div class="row"><span>Sound</span><div class="toggle" id="tgSound" data-on="1"></div></div>
      <div class="row"><span>Shake</span><div class="toggle" id="tgShake" data-on="1"></div></div>
      <div class="row"><span>Quality</span>
        <div class="seg" id="segQ">
          <div data-v="0">LOW</div><div data-v="1">MED</div><div data-v="2" data-on="1">HIGH</div><div data-v="3">AUTO</div>
        </div>
      </div>
      <button class="btn alt" id="btnClose" style="width:100%">CLOSE</button>
    </div>
  </div>

  <div id="dbg"></div>

  <div id="boot"><div><div class="sp"></div><div id="bootMsg">LOADING</div></div></div>
</div>

<script type="module">
/* =====================================================================================
   BELT RUNNER — single-file, procedural, WebGL2. Desktop keyboard + mobile touch, one build.
   ===================================================================================== */

/* --- three.js loader: import-map first, then mirrors, then a sibling file for offline use --- */
const BOOT = document.getElementById('bootMsg');
async function loadThree(){
  /* For a fully offline bundle (Capacitor/WKWebView with no network), drop
     three.module.js next to this file and point the import map at './three.module.js'.
     The chain below is only a safety net. */
  const tries = [
    'three',
    'https://unpkg.com/three@0.160.1/build/three.module.js',
    'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js',
    'https://esm.sh/three@0.160.1',
    './three.module.js'
  ];
  for (let i=0;i<tries.length;i++){
    try {
      const m = await Promise.race([
        import(/* @vite-ignore */ tries[i]),
        new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')), 5000))
      ]);
      if (m && (m.WebGLRenderer || m.default?.WebGLRenderer)) return m.WebGLRenderer ? m : m.default;
    } catch(e){ if (i===0) BOOT.textContent = 'FETCHING ENGINE…'; }
  }
  return null;
}
const THREE = await loadThree();
if (!THREE){
  BOOT.innerHTML = 'Could not load the 3D engine.<br><br>This page pulls three.js from a CDN on first run. ' +
    'If you are offline, drop <b>three.module.js</b> (r160+) next to this file and serve the folder over http.';
  document.querySelector('#boot .sp').style.display='none';
  throw new Error('three.js unavailable');
}

/* =====================================================================================
   1. TUNING — everything worth dialling lives here.
   ===================================================================================== */
const TUNING = {

  /* ---- ground locomotion ------------------------------------------------------------ */
  move: {
    topSpeed:        12.0,   // u/s. Deliberately just under the mid-game belt speed (13.0).
    accelTime:       0.21,   // s to reach top speed from rest
    decelTime:       0.30,   // s to stop from top speed (skid)
    turnAccelScale:  0.52,   // <1 => reversing is a heavy slide before it commits
    airControlScale: 0.60,   // air accel as a fraction of ground accel
    turnRate:        14.0,   // rad/s of yaw smoothing toward the movement vector
    bankPerAngVel:   0.090,  // roll radians per rad/s of yaw rate
    bankMax:         0.335,  // ~19 degrees
    leanPerAccel:    0.0090, // forward/back pitch per u/s^2
    leanMax:         0.42,
    latRefHalf:      6.60,   // reference play half-width; lateral speed scales with play width
    skidSpeed:       4.0,    // speed above which releasing input kicks up skid dust
    slickAccelMul:   0.34,   // accel/decel multiplier while on a slick patch
    slickDecelMul:   0.20,
  },

  /* ---- jump ------------------------------------------------------------------------- */
  jump: {
    height:      2.45,  // u, apex above ground for a full-hold jump
    gravityFall: 56.0,  // u/s^2
    riseRatio:   0.65,  // rise gravity = fall gravity * this
    apexVel:     2.70,  // |vy| below this counts as apex
    apexScale:   0.80,  // extra gravity scale inside the apex window
    apexFrames:  8,     // fixed steps the apex assist may last per jump
    cutMul:      0.45,  // release early -> vy *= this
    coyote:      0.110, // s
    buffer:      0.140, // s
    landHardVel: 12.0,  // |vy| that produces a maximum landing squash
  },

  /* ---- dive ------------------------------------------------------------------------- */
  dive: {
    speedMul:    1.35,  // x topSpeed forward impulse
    upKick:      5.60,
    slideDecel:  8.00,  // u/s^2 belly-slide friction (vs ~40 for run decel)
    slideEndSpd: 2.20,
    slideMax:    1.60,  // s hard cap on the slide
    getUp:       0.65,  // s of locked-out get-up
    cooldown:    0.14,
    colliderH:   0.72,  // collider height while prone (stand = 1.62)
  },

  /* ---- ragdoll --------------------------------------------------------------------- */
  ragdoll: {
    restitution:   0.35,
    friction:      0.72,  // horizontal velocity kept per ground bounce
    angDamp:       2.10,  // 1/s exponential
    spinPerImpulse:0.42,
    settleAng:     1.30,  // rad/s below which it can settle
    settleVel:     1.60,
    settleTime:    0.22,  // s it must stay calm
    blend:         0.30,  // s to blend the pose back — never a pop
    minImpulse:    5.20,  // impulse that promotes a bump to a ragdoll
    beltGrab:      0.85,  // how much belt drag a grounded ragdoll picks up
  },

  /* ---- treadmill ------------------------------------------------------------------- */
  belt: {
    front: -42.0,        // front roller centre (world Z)
    rear:   10.0,        // rear lip (world Z)
    homeZ: -16.0,        // spawn / neutral Z
    halfWidthMesh: 8.6,  // visual belt half width
    airDrag: 0.34,       // fraction of belt drag that still applies mid-air
    // tier speeds: long plateaus, hard step-ups
    tiers:  [10.0, 11.2, 12.4, 13.4, 14.6, 15.8, 17.0, 18.0],
    tierAt: [0, 240, 560, 980, 1520, 2200, 3050, 4100], // distance (u) each tier begins
    stepTime: 0.55,      // s to ease into a new tier
    surge:  { every:[13,21], warn:0.80, mul:1.36, ramp:0.45, hold:2.40, ease:0.9 },
    stutter:{ every:[16,29], warn:0.26, mul:0.44, hold:0.34, ease:0.30 },
    frontBonk:  { push:7.5, up:7.2, ragdollAt:8.5 },
    rearThrow:  { up:10.0, back:15.0, spin:9.0 },
  },

  /* ---- obstacles / scoring --------------------------------------------------------- */
  obs: {
    legibility:   1.20,  // s of guaranteed lead time before contact (desktop)
    gapSeconds:   [0.95, 1.85],  // spacing between spawns, in belt-seconds
    dropHeight:   3.60,  // spawn above the belt and settle onto it
    dropLead:     8.00,  // spawn this far in front of the roller
    nearMissR:    1.35,  // near-miss radius (u)
    nearMissPts:  28,
    maxActive:    10,      // hard ceiling; touch uses 8. Natural play sits at 3-6.
  },

  /* ---- camera ---------------------------------------------------------------------- */
  cam: {
    fovBase: 55, fovTop: 68, fovDive: 72, fovEase: 4.2,
    posFreq: 9.0,        // rad/s spring (critically damped) for position
    lookFreq: 6.0,       // softer spring for the look-at => trails body, leads motion
    lead: 0.30,          // s of velocity lead baked into the look target
    offLand: [0.0, 4.20, 7.35],    // landscape offset from the player
    offPort: [0.0, 5.80,  6.55],   // portrait: higher and closer => belt reads as a corridor
    lookYLand: 1.20, lookYPort: 0.80,
    hazardPull: 3.60,    // camera slides back as the rear lip closes in
    shakeDecay: 11.0, shakeFreq: 34.0, shakePerImpulse: 0.028, shakeMax: 0.60,
    landDip: 0.055,
    hitStop: 0.075,      // s of frozen simulation on a ragdoll hit
  },

  /* ---- fx -------------------------------------------------------------------------- */
  fx: {
    bloomThreshold: 0.86, bloomStrength: 0.62, bloomRadius: 1.35,
    vignette: 0.32,
    streakDive: 0.55, streakSurge: 0.70, streakSpeed: 0.24,
    dustRun: 17,          // particles/s while running flat out
  },

  /* ---- touch overrides (applied live whenever touch is the active input) ----------- */
  mobile: {
    coyote: 0.160, buffer: 0.200, getUp: 0.52,
    legibility: 1.60, nearMissMul: 1.30,
    fovTop: 64, shakeScale: 0.65,
    dodgeAssist: 1.12,    // silent lateral help inside a near-miss window
    padRadius: 90,        // CSS px
    padDead: 8,           // CSS px
    tapMs: 180, tapPx: 20, swipePx: 40, swipeMs: 250,
  },

  /* ---- performance ----------------------------------------------------------------- */
  perf: {
    prCapDesktop: 2.0, prCapTouch: 1.5, prFloor: 1.0, prStep: 0.25,
    downFps: 55, downHold: 2.0, upFps: 58.5, upHold: 30.0,
    maxCatchUp: 5,        // fixed steps per frame — clamps a background tab's return
  },
};

/* =====================================================================================
   2. PALETTE — six committed hexes plus the sky.
   ===================================================================================== */
const C = {
  sun:'#ffcf3d', blossom:'#ff5c7a', plum:'#4b3a6b', slate:'#37455e', mint:'#3fe0b0', ember:'#ff7a29',
  slateLo:'#2b374d', slateHi:'#47597a',
  skyTop:'#2f7fd8', skyMid:'#6fbdf2', skyBot:'#a8e6ff',
  steel:'#8ea4c4', steelDark:'#5a6c8c', warn:'#ffe14d', ink:'#141a2a', cream:'#fff3d6',
};
const col = (hex) => new THREE.Color(hex);

/* reference play half-width: lateral extents and speeds are expressed against it */
const REF_HALF = TUNING.move.latRefHalf;

/* =====================================================================================
   3. Small maths + zero-allocation scratch space.
   ===================================================================================== */
const PI2 = Math.PI*2;
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const clamp01 = (v)=> v<0?0:(v>1?1:v);
const lerp = (a,b,t)=> a+(b-a)*t;
const invLerp = (a,b,v)=> (v-a)/(b-a||1);
const sign = Math.sign;
const smooth = (t)=>{ t=clamp01(t); return t*t*(3-2*t); };
const easeOutCubic = (t)=>{ t=clamp01(t); const u=1-t; return 1-u*u*u; };
const easeOutBack = (t)=>{ t=clamp01(t); const u=t-1, s=1.70158; return 1+ (s+1)*u*u*u + s*u*u; };
/* frame-rate independent exponential approach */
const damp = (cur,tgt,rate,dt)=> tgt + (cur-tgt)*Math.exp(-rate*dt);
const moveTo = (cur,tgt,maxDelta)=>{ const d=tgt-cur; return Math.abs(d)<=maxDelta ? tgt : cur+Math.sign(d)*maxDelta; };
const wrapPi = (a)=>{ a = (a+Math.PI) % PI2; if (a<0) a+=PI2; return a-Math.PI; };
/* critically damped spring, semi-implicit — stable at any dt we feed it */
function spring(state, key, vkey, target, omega, dt){
  const k = omega*omega, c = 2*omega;
  const x = state[key] - target;
  state[vkey] += (-k*x - c*state[vkey])*dt;
  state[key]  += state[vkey]*dt;
  return state[key];
}
/* deterministic RNG so a session is reproducible for debugging */
let _seed = 0x2f6e2b1;
function rnd(){ _seed ^= _seed<<13; _seed ^= _seed>>>17; _seed ^= _seed<<5; _seed|=0; return ((_seed>>>0)%100000)/100000; }
const rndR = (a,b)=> a + (b-a)*rnd();
const rndI = (a,b)=> a + Math.floor(rnd()*(b-a+1));
const pick = (arr)=> arr[Math.floor(rnd()*arr.length)];

/* scratch — every frame-loop vector math uses these, nothing is ever allocated in a step */
const _v1=new THREE.Vector3(), _v2=new THREE.Vector3(), _v3=new THREE.Vector3(), _v4=new THREE.Vector3();
const _q1=new THREE.Quaternion(), _q2=new THREE.Quaternion(), _q3=new THREE.Quaternion();
const _e1=new THREE.Euler(), _m1=new THREE.Matrix4(), _m2=new THREE.Matrix4();
const _c1=new THREE.Color(), _c2=new THREE.Color();

/* =====================================================================================
   4. TEXTURES — every pixel in this game is painted to a <canvas> at boot.
   No external URLs, nothing that can 404.
   ===================================================================================== */
function mkCanvas(w,h){
  const cv = document.createElement('canvas'); cv.width=w; cv.height=h;
  const ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  return {cv, ctx, w, h};
}
function finishTex(cv, {srgb=true, rx=1, ry=1, aniso=4, wrap=true}={}){
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
  t.wrapS = t.wrapT = wrap ? THREE.RepeatWrapping : THREE.ClampToEdgeWrapping;
  t.repeat.set(rx,ry);
  t.anisotropy = aniso;
  t.needsUpdate = true;
  return t;
}
/* tileable value noise -------------------------------------------------------------- */
function hash2(x,y,s){ let n = x*374761393 + y*668265263 + s*1442695041; n = (n ^ (n>>>13)) * 1274126177; return ((n ^ (n>>>16))>>>0)/4294967295; }
function vnoise(x,y,per,s){
  const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  const w=(t)=>t*t*(3-2*t), u=w(xf), v=w(yf);
  const m=(a)=>((a%per)+per)%per;
  const a=hash2(m(xi),m(yi),s), b=hash2(m(xi+1),m(yi),s), c=hash2(m(xi),m(yi+1),s), d=hash2(m(xi+1),m(yi+1),s);
  return lerp(lerp(a,b,u), lerp(c,d,u), v);
}
function fbmFill(ctx,w,h,per,seed,amp,base){
  const img = ctx.getImageData(0,0,w,h), p = img.data;
  for (let y=0;y<h;y++) for (let x=0;x<w;x++){
    let n=0, fx = x/w*per, fy = y/h*per, pp = per, aa = 0.5;
    for (let o=0;o<4;o++){ n += vnoise(fx,fy,pp,seed+o)*aa; fx*=2; fy*=2; pp*=2; aa*=0.5; }
    const i=(y*w+x)*4, d=(n-0.5)*amp*255;
    p[i]   = clamp(p[i]  + d + base,0,255);
    p[i+1] = clamp(p[i+1]+ d + base,0,255);
    p[i+2] = clamp(p[i+2]+ d + base,0,255);
  }
  ctx.putImageData(img,0,0);
}
function rr(ctx,x,y,w,h,r){
  ctx.beginPath();
  const rad = Math.min(r, w*0.5, h*0.5);
  ctx.moveTo(x+rad,y); ctx.arcTo(x+w,y,x+w,y+h,rad); ctx.arcTo(x+w,y+h,x,y+h,rad);
  ctx.arcTo(x,y+h,x,y,rad); ctx.arcTo(x,y,x+w,y,rad); ctx.closePath();
}

/* --- belt tread: base colour + a bump companion ------------------------------------ */
const TEX = {};
function buildBeltTex(){
  const S=512, {cv,ctx} = mkCanvas(S,S);
  ctx.fillStyle = C.slate; ctx.fillRect(0,0,S,S);
  fbmFill(ctx,S,S,8,11,0.16,0);
  // cleats: 8 raised cross-bars per tile
  const N=8, step=S/N;
  for (let i=0;i<N;i++){
    const y = i*step;
    const g = ctx.createLinearGradient(0,y,0,y+step);
    g.addColorStop(0.00,'rgba(255,255,255,0.00)');
    g.addColorStop(0.12,'rgba(255,255,255,0.13)');
    g.addColorStop(0.26,'rgba(0,0,0,0.00)');
    g.addColorStop(0.74,'rgba(0,0,0,0.20)');
    g.addColorStop(0.90,'rgba(0,0,0,0.34)');
    g.addColorStop(1.00,'rgba(255,255,255,0.10)');
    ctx.fillStyle=g; ctx.fillRect(0,y,S,step);
    // tread notches
    ctx.fillStyle='rgba(0,0,0,0.20)';
    for (let x=0;x<S;x+=32) ctx.fillRect(x+6, y+step*0.34, 20, step*0.30);
    ctx.fillStyle='rgba(255,255,255,0.055)';
    for (let x=0;x<S;x+=32) ctx.fillRect(x+6, y+step*0.34, 20, 2);
  }
  // long edge wear bands
  const eg = ctx.createLinearGradient(0,0,S,0);
  eg.addColorStop(0,'rgba(0,0,0,0.34)'); eg.addColorStop(0.08,'rgba(0,0,0,0)');
  eg.addColorStop(0.92,'rgba(0,0,0,0)'); eg.addColorStop(1,'rgba(0,0,0,0.34)');
  ctx.fillStyle=eg; ctx.fillRect(0,0,S,S);
  TEX.belt = finishTex(cv,{srgb:true});

  // bump companion (greyscale of the cleat relief)
  const b = mkCanvas(S,S);
  b.ctx.fillStyle='#808080'; b.ctx.fillRect(0,0,S,S);
  for (let i=0;i<N;i++){
    const y=i*step, g=b.ctx.createLinearGradient(0,y,0,y+step);
    g.addColorStop(0,'#4a4a4a'); g.addColorStop(0.2,'#c8c8c8'); g.addColorStop(0.8,'#8a8a8a'); g.addColorStop(1,'#3c3c3c');
    b.ctx.fillStyle=g; b.ctx.fillRect(0,y,S,step);
    b.ctx.fillStyle='#5a5a5a';
    for (let x=0;x<S;x+=32) b.ctx.fillRect(x+6,y+step*0.34,20,step*0.30);
  }
  TEX.beltBump = finishTex(b.cv,{srgb:false});
}

/* --- hazard stripes for the rear third --------------------------------------------- */
function buildHazardTex(){
  const S=256, {cv,ctx}=mkCanvas(S,S);
  ctx.fillStyle='#1b2130'; ctx.fillRect(0,0,S,S);
  ctx.save(); ctx.translate(S/2,S/2); ctx.rotate(-Math.PI/4); ctx.translate(-S,-S);
  for (let x=0;x<S*2;x+=64){ ctx.fillStyle=C.warn; ctx.fillRect(x,0,32,S*2); }
  ctx.restore();
  ctx.globalAlpha=0.22; fbmFill(ctx,S,S,6,4,0.20,0); ctx.globalAlpha=1;
  TEX.hazard = finishTex(cv,{srgb:true});
}

/* --- brushed metal for rollers, gantries, frame ------------------------------------ */
function buildMetalTex(){
  const S=256, {cv,ctx}=mkCanvas(S,S);
  ctx.fillStyle=C.steel; ctx.fillRect(0,0,S,S);
  for (let i=0;i<1400;i++){
    const y=Math.floor(rnd()*S), a=rnd()*0.10;
    ctx.fillStyle = rnd()>0.5 ? `rgba(255,255,255,${a})` : `rgba(20,30,50,${a})`;
    ctx.fillRect(0,y,S,1);
  }
  fbmFill(ctx,S,S,10,7,0.07,0);

  const r = mkCanvas(S,S); r.ctx.fillStyle='#6e6e6e'; r.ctx.fillRect(0,0,S,S);
  fbmFill(r.ctx,S,S,14,9,0.55,0);
  TEX.metalRough = finishTex(r.cv,{srgb:false});
}

/* --- bold chevrons: obstacle readability ------------------------------------------- */
function buildChevronTex(a,b,key,thick){
  const S=256, {cv,ctx}=mkCanvas(S,S);
  ctx.fillStyle=a; ctx.fillRect(0,0,S,S);
  /* one clean diagonal direction: chunky, legible across the belt, no moire when tiled */
  ctx.strokeStyle=b; ctx.lineWidth=thick||54; ctx.lineCap='butt';
  for (let i=-1;i<3;i++){
    const o=i*S;
    ctx.beginPath(); ctx.moveTo(o-S*0.5, S*1.5); ctx.lineTo(o+S*0.75, -S*0.5); ctx.stroke();
  }
  const sh = ctx.createLinearGradient(0,0,0,S);
  sh.addColorStop(0,'rgba(255,255,255,0.16)'); sh.addColorStop(0.5,'rgba(255,255,255,0)');
  sh.addColorStop(1,'rgba(0,0,0,0.20)');
  ctx.fillStyle=sh; ctx.fillRect(0,0,S,S);
  TEX[key] = finishTex(cv,{srgb:true});
}

/* --- costume fabric + shell freckling --------------------------------------------- */
function buildShellTex(){
  const S=256;
  /* plain shell skin — used for the limbs */
  const base = mkCanvas(S,S);
  base.ctx.fillStyle=C.sun; base.ctx.fillRect(0,0,S,S);
  fbmFill(base.ctx,S,S,12,21,0.055,0);
  base.ctx.globalAlpha=0.12; base.ctx.fillStyle='#fff8dd';
  for (let i=0;i<180;i++){ const x=rnd()*S,y=rnd()*S,r=rnd()*2.4+0.6; base.ctx.beginPath(); base.ctx.arc(x,y,r,0,PI2); base.ctx.fill(); }
  base.ctx.globalAlpha=1;
  TEX.shellPlain = finishTex(base.cv,{srgb:true});

  /* body skin: LatheGeometry puts u=0 at +Z and v=0 at the bottom of the profile, so u=0.5
     is the front and v runs up the belly. That gives us a penguin's bib for free: a cream
     panel centred on the front, widest at the belly, narrowing to a throat and stopping
     under the beak. Painted row by row so the shape is a real bib, not a stripe. */
  const {cv,ctx}=mkCanvas(S,S);
  ctx.drawImage(base.cv,0,0);
  const BIB_TOP = 0.78;
  for (let py=0; py<S; py++){
    const v = 1 - (py+0.5)/S;                       // v=0 at the bottom pole, 1 at the crown
    if (v > BIB_TOP) continue;
    const t = v/BIB_TOP;                            // 0 belly-bottom, 1 throat
    const halfW = 0.212*(1 - 0.40*t*t)*Math.min(1, (1-t)*7.0 + 0.18);
    const a = 0.95*smooth(clamp01((BIB_TOP - v)/0.10));
    if (halfW <= 0.004 || a <= 0.01) continue;
    const x0 = (0.5-halfW)*S, x1 = (0.5+halfW)*S;
    const g = ctx.createLinearGradient(x0,0,x1,0);
    g.addColorStop(0,   'rgba(255,246,222,0)');
    g.addColorStop(0.16,'rgba(255,246,222,'+a.toFixed(3)+')');
    g.addColorStop(0.84,'rgba(255,246,222,'+a.toFixed(3)+')');
    g.addColorStop(1,   'rgba(255,246,222,0)');
    ctx.fillStyle=g; ctx.fillRect(x0, py, x1-x0, 1);
  }
  TEX.shell = finishTex(cv,{srgb:true});

  const f = mkCanvas(S,S);
  f.ctx.fillStyle=C.blossom; f.ctx.fillRect(0,0,S,S);
  f.ctx.strokeStyle='rgba(255,255,255,0.14)'; f.ctx.lineWidth=3;
  for (let i=0;i<S;i+=12){ f.ctx.beginPath(); f.ctx.moveTo(i,0); f.ctx.lineTo(i,S); f.ctx.stroke(); }
  f.ctx.strokeStyle='rgba(0,0,0,0.10)';
  for (let i=0;i<S;i+=12){ f.ctx.beginPath(); f.ctx.moveTo(0,i); f.ctx.lineTo(S,i); f.ctx.stroke(); }
  fbmFill(f.ctx,S,S,18,31,0.07,0);
  TEX.fabric = finishTex(f.cv,{srgb:true});
}

/* --- slick patch ------------------------------------------------------------------- */
function buildSlickTex(){
  const S=256, {cv,ctx}=mkCanvas(S,S);
  ctx.fillStyle='#2a4f6b'; ctx.fillRect(0,0,S,S);
  for (let i=0;i<26;i++){
    const x=rnd()*S,y=rnd()*S,r=rnd()*46+16;
    const g=ctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,'rgba(180,240,255,0.34)'); g.addColorStop(1,'rgba(180,240,255,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,PI2); ctx.fill();
  }
  ctx.strokeStyle='rgba(200,250,255,0.5)'; ctx.lineWidth=4;
  ctx.beginPath(); ctx.arc(S*0.5,S*0.5,S*0.42,0,PI2); ctx.stroke();
  TEX.slick = finishTex(cv,{srgb:true});
}

/* --- warn decal painted on the belt beneath a fresh obstacle ----------------------- */
function buildDecalTex(){
  const S=256, {cv,ctx}=mkCanvas(S,S);
  ctx.clearRect(0,0,S,S);
  ctx.strokeStyle='rgba(255,225,77,0.92)'; ctx.lineWidth=16; ctx.lineJoin='round';
  for (let i=0;i<3;i++){
    const y = 60 + i*62;
    ctx.globalAlpha = 0.9 - i*0.24;
    ctx.beginPath(); ctx.moveTo(52,y+34); ctx.lineTo(S/2,y-18); ctx.lineTo(S-52,y+34); ctx.stroke();
  }
  ctx.globalAlpha=1;
  TEX.decal = finishTex(cv,{srgb:true, wrap:false});
}

/* --- sky gradient (dome) + equirect source for the environment map ----------------- */
function buildSkyTex(){
  const {cv,ctx} = mkCanvas(16,256);
  const g = ctx.createLinearGradient(0,0,0,256);
  g.addColorStop(0.00,'#1e5fb8'); g.addColorStop(0.30,C.skyTop);
  g.addColorStop(0.62,C.skyMid); g.addColorStop(0.86,C.skyBot); g.addColorStop(1.00,'#dff6ff');
  ctx.fillStyle=g; ctx.fillRect(0,0,16,256);
  TEX.sky = finishTex(cv,{srgb:true, wrap:false});
  TEX.sky.wrapS = THREE.RepeatWrapping;

  const e = mkCanvas(512,256);
  const eg = e.ctx.createLinearGradient(0,0,0,256);
  eg.addColorStop(0.00,'#8fd8ff'); eg.addColorStop(0.38,C.skyTop);
  eg.addColorStop(0.52,C.skyMid); eg.addColorStop(0.70,'#cfeeff'); eg.addColorStop(1.00,'#5d6b84');
  e.ctx.fillStyle=eg; e.ctx.fillRect(0,0,512,256);
  // warm key blob so metals catch a highlight
  const sg = e.ctx.createRadialGradient(150,66,0,150,66,120);
  sg.addColorStop(0,'rgba(255,246,214,1)'); sg.addColorStop(0.35,'rgba(255,232,176,0.55)'); sg.addColorStop(1,'rgba(255,220,160,0)');
  e.ctx.fillStyle=sg; e.ctx.beginPath(); e.ctx.arc(150,66,120,0,PI2); e.ctx.fill();
  // cool bounce from below-left

  e.ctx.fillStyle=bg; e.ctx.beginPath(); e.ctx.arc(400,220,150,0,PI2); e.ctx.fill();

}

/* --- distant city / prop skin ------------------------------------------------------ */
function buildPropTex(){
  const S=256, {cv,ctx}=mkCanvas(S,S);

  for (let y=14;y<S;y+=34) for (let x=12;x<S-12;x+=30){

function buildAllTextures(){
  buildBeltTex(); buildHazardTex(); buildMetalTex();
  buildChevronTex(C.ember,'#fff3d6','chevOrange',26);
  buildChevronTex(C.blossom,'#2b1e3d','chevPink',22);

/* =====================================================================================
   5. PLATFORM — feature detection only. Both input modes stay live for the whole session.
   ===================================================================================== */
const PLAT = {
  touchCapable: (navigator.maxTouchPoints|0) > 0 || 'ontouchstart' in window,
  coarse: !!(window.matchMedia && matchMedia('(pointer: coarse)').matches),
  fine:   !!(window.matchMedia && matchMedia('(pointer: fine)').matches),
};
/* active input mode: whichever the player touched last. Never a build-time fork. */
let inputMode = (PLAT.coarse && !PLAT.fine) ? 'touch' : 'key';

let uiReady = false;
/* live, mode-dependent tuning. Mutated in place — never reallocated. */
const LIVE = {
  coyote:0, buffer:0, getUp:0, legibility:0, nearMissR:0, fovTop:0, shakeScale:1, dodgeAssist:1, prCap:2,
};
function applyInputMode(mode){
  if (mode === inputMode && LIVE.coyote) return;
  inputMode = mode;
  const t = mode === 'touch';
  const M = TUNING.mobile;
  LIVE.coyote      = t ? M.coyote     : TUNING.jump.coyote;
  LIVE.buffer      = t ? M.buffer     : TUNING.jump.buffer;
  LIVE.getUp       = t ? M.getUp      : TUNING.dive.getUp;
  LIVE.legibility  = t ? M.legibility : TUNING.obs.legibility;
  LIVE.nearMissR   = TUNING.obs.nearMissR * (t ? M.nearMissMul : 1);
  LIVE.fovTop      = t ? M.fovTop     : TUNING.cam.fovTop;
  LIVE.shakeScale  = t ? M.shakeScale : 1.0;
  LIVE.dodgeAssist = t ? M.dodgeAssist: 1.0;
  LIVE.prCap       = t ? TUNING.perf.prCapTouch : TUNING.perf.prCapDesktop;
  if (uiReady) UI.refreshHints();
}
applyInputMode(inputMode);

/* =====================================================================================
   6. RENDERER / SCENE / LIGHTS
   ===================================================================================== */
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({
  canvas, antialias:false, alpha:false, stencil:false, depth:true,
  powerPreference:'high-performance', preserveDrawingBuffer:false,
});
renderer.debug.checkShaderErrors = false;
renderer.setClearColor(0x2f7fd8, 1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;      // ACES is applied in the composite pass
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = true;
renderer.info.autoReset = false;
const MAX_ANISO = Math.min(4, renderer.capabilities.getMaxAnisotropy());

buildAllTextures();

const KEY_DIR = new THREE.Vector3(-0.52, 1.0, 0.40).normalize();
const RIM_DIR = new THREE.Vector3(0.18, 0.42, 1.0).normalize();

/* ---- sky dome (not lit, so it is a shader, not a Basic material) ------------------ */
{
  const g = new THREE.SphereGeometry(240, 24, 16);
  const m = new THREE.ShaderMaterial({
    depthWrite:false, depthTest:false, side:THREE.BackSide, fog:false,
    uniforms:{
      uTop:{value:col('#1a5ec4')}, uMid:{value:col(C.skyMid)}, uBot:{value:col('#c9efff')},
      uSun:{value:col('#fff6d2')}, uSunDir:{value:KEY_DIR.clone()},
    },
    vertexShader:`varying vec3 vW; void main(){ vW = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader:`
      varying vec3 vW; uniform vec3 uTop,uMid,uBot,uSun,uSunDir;
      void main(){
        vec3 d = normalize(vW);
        float h = clamp(d.y*0.5+0.5, 0.0, 1.0);
        vec3 c = mix(uBot, uMid, smoothstep(0.42,0.60,h));
        c = mix(c, uTop, smoothstep(0.58,0.94,h));
        float horizon = 1.0 - smoothstep(0.0, 0.11, abs(d.y));
        c = mix(c, vec3(0.80,0.91,1.0), horizon*0.34);
        float s = pow(clamp(dot(d, normalize(uSunDir)),0.0,1.0), 26.0);
        c += uSun * s * 0.55;
        gl_FragColor = vec4(c, 1.0);
      }`,
  });
  const sky = new THREE.Mesh(g,m);
  sky.frustumCulled = false; sky.renderOrder = -1000; sky.matrixAutoUpdate = false;
  scene.add(sky);
  scene.userData.sky = sky;
}

/* =====================================================================================
   7. MATERIAL HELPERS — soft-vinyl shell with a fresnel fake-SSS rim.
   ===================================================================================== */
function physMat(o){
  const m = new THREE.MeshPhysicalMaterial(Object.assign({
    roughness:0.72, metalness:0.0, clearcoat:0.0, envMapIntensity:0.85,
  }, o));
  return m;
}
/* Injects a silhouette-edge glow. This is what makes the shell read as soft and squishy. */
function addRim(mat, color, strength, power){
  mat.userData.rim = { value: new THREE.Vector4(0,0,0,0) };
  const c = col(color);
  mat.userData.rim.value.set(c.r*strength, c.g*strength, c.b*strength, power);
  mat.onBeforeCompile = (shader)=>{
    shader.uniforms.uRim = mat.userData.rim;
    shader.fragmentShader = shader.fragmentShader
      .replace('void main() {', 'uniform vec4 uRim;\nvoid main() {')
      .replace('#include <tonemapping_fragment>', `
        {
          float ndv = clamp(dot(normalize(normal), normalize(vViewPosition)), 0.0, 1.0);
          float rimF = pow(1.0 - ndv, uRim.w);
          gl_FragColor.rgb += uRim.rgb * rimF;
        }
        #include <tonemapping_fragment>`);
  };
  mat.customProgramCacheKey = ()=> 'rim';
  return mat;
}

/* =====================================================================================
   8. GEOMETRY HELPERS
   ===================================================================================== */
/* rounded box — chunky toy silhouette, no hard edges anywhere in this game */
function roundedBox(w,h,d,r,seg){
  r = Math.min(r, w*0.5, h*0.5, d*0.5);
  const g = new THREE.BoxGeometry(w,h,d, seg||3, seg||3, seg||3);
  const p = g.attributes.position, hw=w/2-r, hh=h/2-r, hd=d/2-r;
  for (let i=0;i<p.count;i++){
    const x=p.getX(i), y=p.getY(i), z=p.getZ(i);
    const cx=clamp(x,-hw,hw), cy=clamp(y,-hh,hh), cz=clamp(z,-hd,hd);
    _v1.set(x-cx,y-cy,z-cz);
    const l=_v1.length();
    if (l>1e-6){ _v1.multiplyScalar(r/l); p.setXYZ(i, cx+_v1.x, cy+_v1.y, cz+_v1.z); }
  }
  g.computeVertexNormals();
  weldNormals(g);
  return g;
}
/* average normals across duplicated seam vertices — rounded corners must not facet */
function weldNormals(g, eps){
  const p = g.attributes.position, n = g.attributes.normal, q = eps || 1e-4, map = new Map();
  for (let i=0;i<p.count;i++){
    const k = Math.round(p.getX(i)/q)+'|'+Math.round(p.getY(i)/q)+'|'+Math.round(p.getZ(i)/q);
    let a = map.get(k); if (!a){ a=[]; map.set(k,a); } a.push(i);
  }
  map.forEach((list)=>{
    if (list.length < 2) return;
    let x=0,y=0,z=0;
    for (let j=0;j<list.length;j++){ x+=n.getX(list[j]); y+=n.getY(list[j]); z+=n.getZ(list[j]); }
    const l = Math.hypot(x,y,z) || 1; x/=l; y/=l; z/=l;
    for (let j=0;j<list.length;j++) n.setXYZ(list[j], x,y,z);
  });
  n.needsUpdate = true;
  return g;
}
/* smooth lathe from a sparse profile (Catmull-Rom resampled) */
function latheFromProfile(pts, radial, samples){
  const out = [];
  const P = (i)=> pts[clamp(i,0,pts.length-1)];
  const n = samples || 8;
  for (let i=0;i<pts.length-1;i++){
    const p0=P(i-1), p1=P(i), p2=P(i+1), p3=P(i+2);
    for (let s=0;s<n;s++){
      const t=s/n, t2=t*t, t3=t2*t;
      const x = 0.5*((2*p1[0]) + (-p0[0]+p2[0])*t + (2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2 + (-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3);
      const y = 0.5*((2*p1[1]) + (-p0[1]+p2[1])*t + (2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2 + (-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3);
      out.push(new THREE.Vector2(Math.max(0.0006,x), y));
    }
  }
  out.push(new THREE.Vector2(Math.max(0.0006,pts[pts.length-1][0]), pts[pts.length-1][1]));
  return new THREE.LatheGeometry(out, radial||24);
}
/* bake ambient occlusion into vertex colours — free contact darkening, no SSAO */
function bakeAO(geo, {axis='y', lo=-1, hi=1, dark=0.55, cavity=0}={}){
  const p = geo.attributes.position, n = p.count;
  const cAttr = new Float32Array(n*3);
  for (let i=0;i<n;i++){
    const v = axis==='y'?p.getY(i):(axis==='x'?p.getX(i):p.getZ(i));
    let t = clamp01(invLerp(lo,hi,v));
    let s = lerp(dark, 1.0, smooth(t));
    if (cavity){
      const r = Math.hypot(p.getX(i), p.getZ(i));
      s *= lerp(1.0, 1.0-cavity, clamp01(1.0 - r*1.6));
    }
    cAttr[i*3]=s; cAttr[i*3+1]=s; cAttr[i*3+2]=s;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(cAttr,3));
  return geo;
}

/* teardrop paddle: full width at the top, tapering to a soft point at the bottom.
   This is the flipper; scaled down it is a crest feather, rotated it is the tail. */
function paddleGeo(w, h, d, taper){
  const g = new THREE.SphereGeometry(1, 14, 12), p = g.attributes.position;
  const k = taper === undefined ? 0.80 : taper;
  for (let i=0;i<p.count;i++){
    const y = p.getY(i), t = clamp01((1 - y)*0.5);      // 0 at the top, 1 at the tip
    const sc = 1 - k*Math.pow(t, 1.45);
    p.setXYZ(i, p.getX(i)*sc*w, y*h, p.getZ(i)*sc*d);
  }
  g.computeVertexNormals(); weldNormals(g);
  return g;
}
/* soft beak: an ellipsoid pinched toward its tip (-Z is forward) */
function beakGeo(w, h, len){
  const g = new THREE.SphereGeometry(1, 14, 10), p = g.attributes.position;
  for (let i=0;i<p.count;i++){
    const z = p.getZ(i), t = clamp01((1 - z)*0.5);
    const sc = 1 - 0.44*Math.pow(t, 1.70);        // blunt penguin beak, not a needle
    p.setXYZ(i, p.getX(i)*sc*w, p.getY(i)*sc*h, z*len);
  }
  g.computeVertexNormals(); weldNormals(g);
  return g;
}
/* bake a two-tone gradient into vertex colours, times a soft AO term */
function bakeGradient(geo, cLo, cHi, lo, hi, dark){
  const p = geo.attributes.position, n = p.count, out = new Float32Array(n*3);
  const a = col(cLo), b = col(cHi);
  for (let i=0;i<n;i++){
    const t = smooth(clamp01(invLerp(lo, hi, p.getY(i))));
    const sh = lerp(dark === undefined ? 0.74 : dark, 1.0, t);
    out[i*3]   = lerp(a.r, b.r, t)*sh;
    out[i*3+1] = lerp(a.g, b.g, t)*sh;
    out[i*3+2] = lerp(a.b, b.b, t)*sh;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(out,3));
  return geo;
}

/* =====================================================================================
   8b. GEOMETRY MERGE — each obstacle collapses to one or two draw calls.
   Part tint and baked AO both ride in the vertex colours (no SSAO anywhere in this game).
   ===================================================================================== */
function mergeGeos(items){
  let vc=0, ic=0;
  for (const it of items){
    const g = it.geo;
    if (!g.index) throw new Error('mergeGeos needs indexed geometry');
    vc += g.attributes.position.count; ic += g.index.count;
  }
  const pos = new Float32Array(vc*3), nor = new Float32Array(vc*3),
        uv  = new Float32Array(vc*2), colr= new Float32Array(vc*3);
  const idx = vc > 65535 ? new Uint32Array(ic) : new Uint16Array(ic);
  let vo=0, io=0;
  const nm = new THREE.Matrix3();
  for (const it of items){
    const g = it.geo, m = it.matrix || _m2.identity();
    nm.getNormalMatrix(m);
    const p = g.attributes.position, nAttr = g.attributes.normal, uvA = g.attributes.uv;
    const cnt = p.count;
    const tint = _c1.set(it.tint || '#ffffff');
    const ao = it.ao;
    const su = it.uv ? it.uv[0] : 1, sv = it.uv ? it.uv[1] : 1;
    for (let i=0;i<cnt;i++){
      _v1.fromBufferAttribute(p,i).applyMatrix4(m);
      pos[(vo+i)*3]=_v1.x; pos[(vo+i)*3+1]=_v1.y; pos[(vo+i)*3+2]=_v1.z;
      if (nAttr){ _v2.fromBufferAttribute(nAttr,i).applyMatrix3(nm).normalize();
        nor[(vo+i)*3]=_v2.x; nor[(vo+i)*3+1]=_v2.y; nor[(vo+i)*3+2]=_v2.z; }
      if (uvA){ uv[(vo+i)*2]=uvA.getX(i)*su; uv[(vo+i)*2+1]=uvA.getY(i)*sv; }
      let s = 1;
      if (ao){ const t = clamp01(invLerp(ao.lo, ao.hi, _v1.y)); s = lerp(ao.dark, 1, smooth(t)); }
      colr[(vo+i)*3]=tint.r*s; colr[(vo+i)*3+1]=tint.g*s; colr[(vo+i)*3+2]=tint.b*s;
    }
    const gi = g.index;
    for (let i=0;i<gi.count;i++) idx[io+i] = gi.getX(i) + vo;
    vo += cnt; io += gi.count;
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.BufferAttribute(pos,3));
  out.setAttribute('normal',   new THREE.BufferAttribute(nor,3));
  out.setAttribute('uv',       new THREE.BufferAttribute(uv,2));
  out.setAttribute('color',    new THREE.BufferAttribute(colr,3));
  out.setIndex(new THREE.BufferAttribute(idx,1));
  out.computeBoundingSphere();
  return out;
}
const MTX = (x,y,z, rx,ry,rz, sx,sy,sz)=>{
  const m = new THREE.Matrix4();
  m.compose(new THREE.Vector3(x,y,z),
    new THREE.Quaternion().setFromEuler(new THREE.Euler(rx||0,ry||0,rz||0)),
    new THREE.Vector3(sx===undefined?1:sx, sy===undefined?1:sy, sz===undefined?1:sz));
  return m;
};

/* =====================================================================================
   9. THE CHARACTER — an original chunky penguin. One continuous egg, no neck, teardrop
   flippers off the upper third, tiny feet poking out the front. Built once, posed
   procedurally forever. Local space: origin at the feet, front faces -Z, up is +Y.
   ===================================================================================== */
const ANIM = {
  strideRate: 2.10,     // radians of leg phase per unit travelled — small, fast penguin steps
  legAmp: 0.52,         // feet paddle rather than stride
  armAmp: 0.46,         // flippers swing gently fore-aft...
  flareBase: 0.42, flareSpeed: 0.44,   // ...and flare outward the faster you go
  bobAmp: 0.052, swayAmp: 0.118, swayRoll: 0.088,   // the waddle lives here
  blendFast: 12.0,      // 1/s for ordinary state changes (~83ms)
};
const BODY_Y = 0.86;    // centre of the egg in rig space; the ragdoll pivots about this

function buildCharacter(){
  const root = new THREE.Group();                  // world position only
  const flatG= new THREE.Group();  root.add(flatG); // world-vertical squash (belly slides)
  const rotG = new THREE.Group();  flatG.add(rotG); // full orientation (quaternion)
  const sqG  = new THREE.Group();  rotG.add(sqG);   // squash & stretch, body-local
  const bodyG= new THREE.Group();  sqG.add(bodyG);  // bob + waddle sway

  /* ---- materials ---- */
  const matShell = addRim(physMat({
    map:TEX.shell, roughness:0.60, metalness:0.0, vertexColors:true,
    sheen:0.62, sheenColor:col(C.cream), sheenRoughness:0.55, envMapIntensity:0.78,
    clearcoat:0.14, clearcoatRoughness:0.72,
  }), '#ffe6a8', 0.34, 2.7);
  const matFlipper = addRim(physMat({
    map:TEX.shellPlain, vertexColors:true, roughness:0.52,
    clearcoat:0.32, clearcoatRoughness:0.45, envMapIntensity:0.9,
  }), '#ffd79a', 0.22, 2.9);
  const matFoot = physMat({ color:col(C.ember), roughness:0.58, clearcoat:0.18, clearcoatRoughness:0.45, envMapIntensity:0.55 });
  const matTrim = physMat({ vertexColors:true, roughness:0.40, clearcoat:0.45, clearcoatRoughness:0.28, envMapIntensity:1.0 });
  const matCrest = physMat({ map:TEX.fabric, color:col(C.ember), roughness:0.86, sheen:0.35, sheenColor:col(C.cream), envMapIntensity:0.5 });
  const matEye  = physMat({ color:col('#14102a'), roughness:0.22, clearcoat:0.85, clearcoatRoughness:0.10, envMapIntensity:0.35 });
  const matGlint= physMat({ color:col('#ffffff'), roughness:0.10, emissive:col('#ffffff'), emissiveIntensity:0.35 });

  /* ---- the body: one egg, widest low, doming straight into the head ---- */
  const bodyGeo = bakeAO(latheFromProfile([
    [0.000,-0.755],[0.229,-0.700],[0.359,-0.610],[0.435,-0.500],[0.481,-0.380],
    [0.498,-0.250],[0.500,-0.120],[0.494, 0.010],[0.481, 0.140],[0.458, 0.265],
    [0.431, 0.385],[0.408, 0.500],[0.385, 0.610],[0.321, 0.700],[0.176, 0.752],
    [0.000, 0.762],
  ], 28, 5), {axis:'y', lo:-0.78, hi:0.42, dark:0.58});
  const shell = new THREE.Mesh(bodyGeo, matShell);
  shell.position.y = BODY_Y; shell.castShadow = true;
  bodyG.add(shell);

  /* ---- beak and tail: one draw call, tinted per part ---- */
  const trim = new THREE.Mesh(mergeGeos([
    {geo: beakGeo(0.105, 0.098, 0.180), matrix: MTX(0, 1.262, -0.495, -0.15,0,0), tint:C.ember},
    /* the tail is a shaded extension of the body, not a contrasting patch: seen face-on
       from the game camera a dark tail reads as a hole punched in the silhouette */
    {geo: paddleGeo(0.140, 0.265, 0.058), matrix: MTX(0, 0.430, 0.360, 1.50,0,0), tint:'#f2c33e',
     ao:{lo:0.30, hi:0.52, dark:0.66}},
  ]), matTrim);
  trim.castShadow = true; bodyG.add(trim);

  /* ---- crest: two soft feathers on a pivot, so they keep springing after the head stops ---- */
  const crestG = new THREE.Group(); crestG.position.set(0, 1.470, 0.010); bodyG.add(crestG);
  const featherGeo = paddleGeo(0.062, 0.200, 0.038, 0.88);
  const crest = new THREE.Mesh(mergeGeos([
    {geo: featherGeo, matrix: MTX(-0.092, 0.115, 0.010, 0.92, 0,  0.34), tint:'#ffffff'},
    {geo: featherGeo, matrix: MTX( 0.092, 0.115, 0.010, 0.92, 0, -0.34), tint:'#ffffff'},
  ]), matCrest);
  crest.castShadow = true; crestG.add(crest);

  /* ---- eyes: one mesh built around the eye line, so a Y-squash reads as a blink ---- */
  const EY = 1.348, EZ = -0.330;
  const eyeG = new THREE.SphereGeometry(0.083, 14, 12);
  const eyes = new THREE.Mesh(mergeGeos([
    {geo:eyeG, matrix:MTX(-0.139,0,0, 0,0,0, 1,1,0.66), tint:'#ffffff'},
    {geo:eyeG, matrix:MTX( 0.139,0,0, 0,0,0, 1,1,0.66), tint:'#ffffff'},
  ]), matEye);
  eyes.position.set(0, EY, EZ); bodyG.add(eyes);
  const glintG = new THREE.SphereGeometry(0.022, 8, 6);
  const glints = new THREE.Mesh(mergeGeos([
    {geo:glintG, matrix:MTX(-0.152, 1.378, -0.384), tint:'#ffffff'},
    {geo:glintG, matrix:MTX( 0.126, 1.378, -0.384), tint:'#ffffff'},
  ]), matGlint);
  bodyG.add(glints);

  /* ---- flippers: teardrop paddles, sun at the shoulder fading to plum at the tip ---- */
  function makeFlipper(side){
    const pivot = new THREE.Group();
    pivot.position.set(0.428*side, 1.062, 0.020);
    const geo = bakeGradient(paddleGeo(0.158, 0.318, 0.088), C.ember, C.sun, -0.10, 0.24, 0.84);
    const pad = new THREE.Mesh(geo, matFlipper);
    pad.position.y = -0.288; pad.castShadow = true;
    pivot.add(pad);
    bodyG.add(pivot);
    return pivot;
  }
  /* ---- feet: stubby pads that poke out from under the belly. Barely any leg. ---- */
  function makeFoot(side){
    const pivot = new THREE.Group();
    pivot.position.set(0.205*side, 0.300, -0.020);
    const padG = new THREE.Group(); padG.position.y = -0.235; pivot.add(padG);
    const pad = new THREE.Mesh(roundedBox(0.290, 0.128, 0.400, 0.056, 3), matFoot);
    pad.position.set(0, 0, -0.235); pad.rotation.y = -0.19*side; pad.castShadow = true;
    padG.add(pad);
    return { pivot, boot:padG };
  }
  const armL = makeFlipper(-1), armR = makeFlipper(1);
  const legL = makeFoot(-1), legR = makeFoot(1);
  bodyG.add(legL.pivot, legR.pivot);

  /* blob / contact shadow, always on: real shadows sit on top of it when enabled */
  const blob = new THREE.Mesh(new THREE.PlaneGeometry(1.9,1.9), new THREE.MeshBasicMaterial({
    map:TEX.blob, transparent:true, depthWrite:false, opacity:0.62, color:0x0a1424,
    blending:THREE.NormalBlending,
  }));
  blob.rotation.x = -Math.PI/2; blob.renderOrder = 2;

  return {
    root, flatG, rotG, sqG, bodyG, shell, trim, crestG, crest,
    eyes, glints, armL, armR, legL, legR, blob,
    mats:{ matShell, matFlipper, matFoot, matTrim, matCrest, matEye },
  };
}

const rig = buildCharacter();
scene.add(rig.root, rig.blob);

/* ---- pose application: everything visual is derived, nothing is keyframed ---------- */
const POSE_TMP = { crX:0, crZ:0, crVX:0, crVZ:0 };

function applyPose(p, dt){
  const r = rig;
  r.root.position.set(p.x, p.y, p.z);
  r.root.quaternion.identity();
  r.rotG.quaternion.set(p.qx, p.qy, p.qz, p.qw);

  /* world-vertical flatten: a belly-sliding penguin squashes against the belt */
  r.flatG.scale.set(1 + (1-p.flat)*0.45, p.flat, 1 + (1-p.flat)*0.30);

  /* squash / stretch, plus the pivot shift that lets a ragdoll tumble about its middle */
  r.sqG.scale.set(p.sx, p.sy, p.sz);
  r.sqG.position.y = p.pivot;

  const W = p.w;
  const spN = clamp01(p.speedN);
  const ph  = p.phase;
  const sinP = Math.sin(ph);

  /* ---- torso: bob on 2x the step frequency, lateral sway on 1x — this is the waddle ---- */
  const bob  = Math.sin(ph*2)*ANIM.bobAmp*spN;
  const sway = sinP*ANIM.swayAmp*spN;
  r.bodyG.position.set(sway*W.run, bob*W.run + p.breath, 0);
  r.bodyG.rotation.z = -sinP*ANIM.swayRoll*spN*W.run;
  r.bodyG.rotation.y = sinP*0.075*spN*W.run;

  /* ---- limb targets per state, then weighted ---- */
  const legAmp = ANIM.legAmp*(0.36+0.64*spN), armAmp = ANIM.armAmp*(0.30+0.70*spN);
  const runHipL =  sinP*legAmp, runHipR = -sinP*legAmp;
  const runShL  = -sinP*armAmp, runShR = sinP*armAmp;
  const runFlare = ANIM.flareBase + ANIM.flareSpeed*spN;

  // airborne: feet tuck, flippers wide out for balance
  const airHipL = 0.46 - p.vyN*0.20, airHipR = 0.34 + p.vyN*0.18;
  const airShL = -0.30, airShR = -0.22, airFlare = 1.05;
  // dive: a rigid toboggan — flippers swept back along the body
  const dvHip = 0.30, dvSh = -1.42, dvFlare = 0.12;
  // get-up: push off the belt with both flippers
  const gWob = Math.sin(p.getT*26.0)*(1-clamp01(p.getT*1.6))*0.30;
  const gHip = 0.66 + gWob, gSh = -0.62 + gWob*1.6, gFlare = 0.62;
  // ragdoll: limp, slow drift
  const rHip = 0.26 + Math.sin(ph*0.30)*0.38, rSh = 0.20 + Math.cos(ph*0.27)*0.55, rFlare = 0.66;

  const hipL = W.run*runHipL + W.air*airHipL + W.dive*dvHip + W.get*gHip + W.rag*rHip;
  const hipR = W.run*runHipR + W.air*airHipR + W.dive*dvHip + W.get*(gHip*0.82) + W.rag*(rHip*0.7);
  const shL  = W.run*runShL  + W.air*airShL  + W.dive*dvSh  + W.get*gSh   + W.rag*rSh;
  const shR  = W.run*runShR  + W.air*airShR  + W.dive*dvSh  + W.get*gSh   + W.rag*(rSh*0.8);
  const flare= W.run*runFlare+ W.air*airFlare+ W.dive*dvFlare+ W.get*gFlare + W.rag*rFlare;

  r.legL.pivot.rotation.x = hipL; r.legR.pivot.rotation.x = hipR;
  r.legL.boot.rotation.x = -hipL*0.55 + (W.dive+W.rag)*0.30;   // pads stay flattish to the belt
  r.legR.boot.rotation.x = -hipR*0.55 + (W.dive+W.rag)*0.30;
  r.armL.rotation.x = shL; r.armR.rotation.x = shR;
  r.armL.rotation.z = -flare; r.armR.rotation.z = flare;       // positive flare splays outward

  /* ---- crest: springy secondary motion, plus an idle twitch ---- */
  const tgtX = clamp(-p.accZ*0.013 - p.vyN*0.12, -0.7, 0.7) + p.twitch*0.5;
  const tgtZ = clamp(-p.accX*0.013, -0.7, 0.7) - r.bodyG.rotation.z*1.5;
  POSE_TMP.crVX += (tgtX - POSE_TMP.crX)*76*dt - POSE_TMP.crVX*10.5*dt;
  POSE_TMP.crVZ += (tgtZ - POSE_TMP.crZ)*76*dt - POSE_TMP.crVZ*10.5*dt;
  POSE_TMP.crX += POSE_TMP.crVX*dt; POSE_TMP.crZ += POSE_TMP.crVZ*dt;
  r.crestG.rotation.set(POSE_TMP.crX, 0, POSE_TMP.crZ);

  /* ---- blink (eyes squash to a slit) ---- */
  const bl = 1 - p.blink*0.92;
  r.eyes.scale.set(1.0 + p.blink*0.16, bl, 1.0);
  r.glints.visible = p.blink < 0.55;

  /* ---- blob shadow ---- */
  const gy = p.groundY;
  const hAbove = clamp01((p.y - gy)/2.6);
  r.blob.position.set(p.x, gy + 0.016, p.z);
  const bs = (1.05 - hAbove*0.34) * (0.92 + 0.24*p.sx);
  r.blob.scale.set(bs, bs, 1);
  r.blob.material.opacity = (0.60 - hAbove*0.36) * (1 - W.rag*0.25);
}

/* =====================================================================================
   10. THE TREADMILL
   ===================================================================================== */
const B = TUNING.belt;
const BELT_LEN  = B.rear - B.front;
const BELT_MIDZ = (B.rear + B.front)*0.5;
const HAZARD_Z  = B.rear - BELT_LEN/3;          // rear third is the hazard zone
const BELT_TILE = BELT_LEN/16;                   // world units per texture tile along Z

const world = {};
function buildTreadmill(){
  const W = B.halfWidthMesh*2;

  /* ---- belt surface ---- */
  TEX.belt.repeat.set(Math.round(W/BELT_TILE), 16);
  TEX.beltBump.repeat.copy(TEX.belt.repeat);
  const beltMat = physMat({
    map:TEX.belt, bumpMap:TEX.beltBump, bumpScale:0.42,
    roughness:0.84, metalness:0.04, envMapIntensity:0.42, sheen:0.10,
  });
  const belt = new THREE.Mesh(new THREE.PlaneGeometry(W, BELT_LEN, 1, 12), beltMat);
  belt.rotation.x = -Math.PI/2; belt.position.set(0, 0, BELT_MIDZ);
  belt.receiveShadow = true;
  scene.add(belt);
  world.belt = belt; world.beltMat = beltMat;

  /* ---- hazard zone: a painted world region, so it does NOT scroll with the belt ---- */
  const hz = B.rear - HAZARD_Z;
  TEX.hazard.repeat.set(Math.round(W/2.4), Math.round(hz/2.4));
  const hazMat = physMat({
    map:TEX.hazard, roughness:0.66, transparent:true, opacity:0.80,
    polygonOffset:true, polygonOffsetFactor:-2, polygonOffsetUnits:-2, envMapIntensity:0.4,
  });
  const haz = new THREE.Mesh(new THREE.PlaneGeometry(W, hz), hazMat);
  haz.rotation.x = -Math.PI/2; haz.position.set(0, 0.004, HAZARD_Z + hz*0.5);
  scene.add(haz);
  world.hazard = haz; world.hazMat = hazMat;

  /* ---- rollers ---- */
  const rollGeo = new THREE.CylinderGeometry(0.92, 0.92, W+0.5, 22, 1);
  TEX.metalRoll = TEX.metal.clone(); TEX.metalRoll.repeat.set(7,1); TEX.metalRoll.needsUpdate = true;
  const rollMat = physMat({ map:TEX.metalRoll, color:col('#7f93b2'), roughnessMap:TEX.metalRough, metalness:0.42, roughness:0.68, envMapIntensity:0.55 });
  world.rollers = [];
  for (const z of [B.front, B.rear]){
    const g = new THREE.Group(); g.rotation.z = Math.PI/2; g.position.set(0, -0.06, z);
    const m = new THREE.Mesh(rollGeo, rollMat); m.castShadow = true; m.receiveShadow = true;
    g.add(m); scene.add(g); world.rollers.push(m);
  }
  /* front roller bumper cap — the thing you slam into */
  const bump = new THREE.Mesh(roundedBox(W+0.9, 0.62, 0.9, 0.28, 3),
    physMat({ color:col(C.ember), roughness:0.42, clearcoat:0.5, envMapIntensity:1.0 }));
  bump.position.set(0, 0.60, B.front - 0.52); bump.castShadow = true; bump.receiveShadow = true;
  scene.add(bump); world.frontBumper = bump;

  /* ---- rear lip + the drop behind it ---- */
  const lipMat = physMat({ color:col('#2a3348'), roughness:0.5, metalness:0.3,
    emissive:col('#ff2a1e'), emissiveIntensity:0.9, envMapIntensity:0.9 });
  const lip = new THREE.Mesh(roundedBox(W+0.9, 0.34, 0.7, 0.14, 3), lipMat);
  lip.position.set(0, 0.10, B.rear + 0.42);
  scene.add(lip); world.lip = lip; world.lipMat = lipMat;

  const pitMat = physMat({ color:col('#101827'), roughness:0.95, envMapIntensity:0.2 });
  const pit = new THREE.Mesh(new THREE.PlaneGeometry(W+8, 46), pitMat);
  pit.rotation.x = -Math.PI/2; pit.position.set(0, -3.4, B.rear + 23);
  scene.add(pit);
  const pitBack = new THREE.Mesh(new THREE.PlaneGeometry(W+8, 4.2), pitMat);
  pitBack.position.set(0, -1.3, B.rear + 0.9); pitBack.rotation.y = Math.PI;
  scene.add(pitBack);

  /* ---- side rails + skirt ---- */
  const railMat = physMat({ map:TEX.metal, roughnessMap:TEX.metalRough, metalness:0.55, roughness:0.40, envMapIntensity:1.1 });
  const skirtMat = physMat({ color:col(C.slateLo), roughness:0.62, metalness:0.2, envMapIntensity:0.6 });
  for (const s of [-1,1]){
    const rail = new THREE.Mesh(roundedBox(0.42, 0.42, BELT_LEN+2.4, 0.19, 2), railMat);
    rail.position.set(s*(B.halfWidthMesh+0.42), 0.98, BELT_MIDZ); rail.castShadow = true; rail.receiveShadow = true;
    scene.add(rail);
    const skirt = new THREE.Mesh(new THREE.PlaneGeometry(BELT_LEN+2.4, 1.5), skirtMat);
    skirt.position.set(s*(B.halfWidthMesh+0.62), 0.30, BELT_MIDZ);
    skirt.rotation.y = s>0 ? -Math.PI/2 : Math.PI/2;
    scene.add(skirt);
  }
  /* posts, instanced */
  {
    const n = 2*Math.floor(BELT_LEN/5)+2;
    const inst = new THREE.InstancedMesh(roundedBox(0.30,1.05,0.30,0.11,2), railMat, n);
    let i=0;
    for (let z=B.front; z<=B.rear+0.01; z+=5) for (const s of [-1,1]){
      if (i>=n) break;
      _v1.set(s*(B.halfWidthMesh+0.42), 0.46, z);
      _m1.makeTranslation(_v1.x,_v1.y,_v1.z); inst.setMatrixAt(i++, _m1);
    }
    inst.count = i; inst.instanceMatrix.needsUpdate = true;
    scene.add(inst);
  }

  /* ---- klaxon lights at the front: surge telegraph ---- */
  world.klaxons = [];
  for (const s of [-1,1]){
    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.11,0.14,2.5,10), railMat);
    post.position.set(s*(B.halfWidthMesh+0.42), 1.9, B.front+1.4); scene.add(post);
    const kMat = physMat({ color:col('#5c1a10'), roughness:0.32, emissive:col('#ff3b18'), emissiveIntensity:0.0,
      clearcoat:1.0, envMapIntensity:1.2 });
    const k = new THREE.Mesh(new THREE.SphereGeometry(0.26, 14, 11), kMat);
    k.position.set(s*(B.halfWidthMesh+0.42), 3.15, B.front+1.4); scene.add(k);
    const cage = new THREE.Mesh(new THREE.TorusGeometry(0.28,0.035,6,14), railMat);
    cage.position.copy(k.position); cage.rotation.x=Math.PI/2; scene.add(cage);
    world.klaxons.push(kMat);
  }

  /* ---- dynamic play-edge strips: the honest boundary in every aspect ratio ---- */
  world.edges = [];
  const edgeMat = new THREE.MeshBasicMaterial({ color:col(C.mint), transparent:true, opacity:0.30, depthWrite:false });
  for (const s of [-1,1]){
    const e = new THREE.Mesh(new THREE.PlaneGeometry(0.20, 1), edgeMat);
    e.rotation.x = -Math.PI/2; e.position.set(s*REF_HALF, 0.012, BELT_MIDZ);
    e.scale.set(1, BELT_LEN, 1); e.renderOrder = 3;
    scene.add(e); world.edges.push(e);
  }
}
buildTreadmill();

/* =====================================================================================
   11. BACKGROUND — chunky parallax props, instanced and recycled.
   ===================================================================================== */
function buildBackground(){
  const groundMat = physMat({ color:col('#54688c'), roughness:0.92, envMapIntensity:0.35 });
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), groundMat);
  ground.rotation.x = -Math.PI/2; ground.position.set(0, -1.15, -40);
  scene.add(ground);

  const propMat = physMat({ map:TEX.prop, roughness:0.72, envMapIntensity:0.6 });
  const farMat  = physMat({ color:col('#7f97bd'), roughness:0.85, envMapIntensity:0.45 });

  const near = new THREE.InstancedMesh(roundedBox(1,1,1,0.12,2), propMat, 26);
  const far  = new THREE.InstancedMesh(roundedBox(1,1,1,0.10,2), farMat, 22);
  near.castShadow = false; near.receiveShadow = false;
  world.props = [];
  for (let i=0;i<26;i++){
    const s = i%2? 1:-1;
    world.props.push({ x:s*rndR(18,34), y:0, z:rndR(-150, 20), w:rndR(3.2,6.4), h:rndR(3.5,13), d:rndR(3.2,6.0), r:rndR(0,PI2), speed:0.55 });
  }
  world.farProps = [];
  for (let i=0;i<22;i++){
    const s = i%2? 1:-1;
    world.farProps.push({ x:s*rndR(42,96), y:0, z:rndR(-220, 20), w:rndR(7,16), h:rndR(10,34), d:rndR(7,16), r:rndR(0,PI2), speed:0.22 });
  }
  scene.add(near, far);
  world.nearInst = near; world.farInst = far;
  updateProps(0, true);
}
function writeProps(list, inst, zRecycleFront, zRecycleBack){
  for (let i=0;i<list.length;i++){
    const p = list[i];
    if (p.z > zRecycleBack){ p.z -= (zRecycleBack - zRecycleFront); p.x = Math.sign(p.x)*rndR(Math.abs(p.x)*0.8, Math.abs(p.x)*1.2); }
    _v1.set(p.x, p.h*0.5 - 1.15, p.z);
    _q1.setFromAxisAngle(_v2.set(0,1,0), p.r);
    _v3.set(p.w, p.h, p.d);
    _m1.compose(_v1,_q1,_v3);
    inst.setMatrixAt(i, _m1);
  }
  inst.instanceMatrix.needsUpdate = true;
}
function updateProps(dz, force){
  if (dz !== 0 || force){
    for (let i=0;i<world.props.length;i++)    world.props[i].z    += dz*0.55;
    for (let i=0;i<world.farProps.length;i++) world.farProps[i].z += dz*0.22;
    writeProps(world.props,    world.nearInst, -150, 40);
    writeProps(world.farProps, world.farInst,  -220, 60);
  }
}
buildBackground();

/* =====================================================================================
   12. PARTICLES — pooled, instanced, allocation-free.
   ===================================================================================== */
class Pool {
  constructor(geo, mat, count, opts={}){
    this.n = count;
    this.mesh = new THREE.InstancedMesh(geo, mat, count);
    this.mesh.frustumCulled = false;
    this.mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    this.mesh.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(count*3), 3);
    this.mesh.instanceColor.setUsage(THREE.DynamicDrawUsage);
    this.px=new Float32Array(count); this.py=new Float32Array(count); this.pz=new Float32Array(count);
    this.vx=new Float32Array(count); this.vy=new Float32Array(count); this.vz=new Float32Array(count);
    this.life=new Float32Array(count); this.maxLife=new Float32Array(count);
    this.size=new Float32Array(count); this.size1=new Float32Array(count);
    this.rot=new Float32Array(count); this.rotV=new Float32Array(count);
    this.drag=new Float32Array(count); this.grav=new Float32Array(count);
    this.billboard = opts.billboard !== false;
    this.bounce = !!opts.bounce;
    this.head = 0; this.alive = 0;
    for (let i=0;i<count;i++){ _m1.makeScale(0,0,0); this.mesh.setMatrixAt(i,_m1); }
  }
  spawn(x,y,z, vx,vy,vz, s0,s1, life, r,g,b, grav, drag, rotV){
    let i = -1;
    for (let k=0;k<this.n;k++){ const j=(this.head+k)%this.n; if (this.life[j]<=0){ i=j; break; } }
    if (i<0){ i = this.head; }                    // steal the oldest slot rather than allocate
    this.head = (i+1)%this.n;
    this.px[i]=x; this.py[i]=y; this.pz[i]=z;
    this.vx[i]=vx; this.vy[i]=vy; this.vz[i]=vz;
    this.size[i]=s0; this.size1[i]=s1;
    this.life[i]=life; this.maxLife[i]=life;
    this.rot[i]= rnd()*PI2; this.rotV[i]=rotV||0;
    this.grav[i]=grav; this.drag[i]=drag;
    this.mesh.instanceColor.setXYZ(i, r,g,b);
    return i;
  }
  step(dt, beltZ){
    let alive = 0;
    const bb = this.billboard, cq = camera.quaternion;
    for (let i=0;i<this.n;i++){
      if (this.life[i] <= 0) continue;
      this.life[i] -= dt;
      if (this.life[i] <= 0){ _m1.makeScale(0,0,0); this.mesh.setMatrixAt(i,_m1); continue; }
      const d = Math.exp(-this.drag[i]*dt);
      this.vy[i] -= this.grav[i]*dt;
      this.vx[i]*=d; this.vz[i]*=d; if (this.grav[i]===0) this.vy[i]*=d;
      this.px[i]+=this.vx[i]*dt; this.py[i]+=this.vy[i]*dt; this.pz[i]+=this.vz[i]*dt + beltZ;
      if (this.bounce && this.py[i] < 0.03){ this.py[i]=0.03; this.vy[i]=Math.abs(this.vy[i])*0.42; this.vx[i]*=0.7; this.vz[i]*=0.7; }
      this.rot[i]+=this.rotV[i]*dt;
      const t = 1 - this.life[i]/this.maxLife[i];
      const s = lerp(this.size[i], this.size1[i], t);
      _v1.set(this.px[i], this.py[i], this.pz[i]);
      if (bb){ _q1.copy(cq); _q2.setFromAxisAngle(_v3.set(0,0,1), this.rot[i]); _q1.multiply(_q2); }
      else { _q1.setFromAxisAngle(_v3.set(0.4,0.82,0.4), this.rot[i]); }
      _v2.set(s,s,s);
      _m1.compose(_v1,_q1,_v2);
      this.mesh.setMatrixAt(i,_m1);
      alive++;
    }
    this.alive = alive;
    this.mesh.instanceMatrix.needsUpdate = true;
    this.mesh.instanceColor.needsUpdate = true;
  }
}

const FX = {};
function buildParticles(scaleN){

  }), q(150), {billboard:false, bounce:true});

}

const CONF_COLS = [C.sun, C.blossom, C.mint, C.ember, '#ffffff', '#8fd8ff'];
function burstConfetti(x,y,z, n){
  for (let i=0;i<n;i++){

/* =====================================================================================
   14. OBSTACLES — six types, pooled, riding the belt toward the player.
   Lateral extents scale with the playable width so every aspect ratio plays identically;
   depth (Z) extents never scale, so timing windows are identical too.
   ===================================================================================== */
const OT = { SWEEP:0, HIGH:1, PEND:2, FAN:3, BUMP:4, SLICK:5 };
const OBS_DEF = [];

function obsMaterials(){
  const body = (tex)=> physMat({ map:tex, vertexColors:true, roughness:0.56, metalness:0.05,
    clearcoat:0.30, clearcoatRoughness:0.45, envMapIntensity:0.95, sheen:0.2 });
  const trim = ()=> physMat({ map:TEX.metal, roughnessMap:TEX.metalRough, vertexColors:true,
    metalness:0.62, roughness:0.42, envMapIntensity:1.1 });
  return { body, trim };
}
const OM = obsMaterials();

function buildObstacleDefs(){
  /* ---------- 0: low sweeper bar — jump it ---------- */
  {
    const bar = roundedBox(4.4, 0.42, 0.52, 0.18, 2);
    const cap = roundedBox(0.62, 0.62, 1.05, 0.22, 2);
    const sled= roundedBox(0.80, 0.24, 1.30, 0.10, 2);
    const geo = mergeGeos([
      {geo:bar, matrix:MTX(0,0.44,0), tint:C.ember, uv:[1.5,0.30], ao:{lo:0.10,hi:0.9,dark:0.55}},
      {geo:cap, matrix:MTX(-2.30,0.40,0), tint:C.cream, uv:[0.5,0.5], ao:{lo:0.05,hi:0.9,dark:0.6}},
      {geo:cap, matrix:MTX( 2.30,0.40,0), tint:C.cream, uv:[0.5,0.5], ao:{lo:0.05,hi:0.9,dark:0.6}},
      {geo:sled,matrix:MTX(-2.30,0.13,0), tint:C.plum, uv:[0.6,0.2], ao:{lo:0,hi:0.4,dark:0.5}},
      {geo:sled,matrix:MTX( 2.30,0.13,0), tint:C.plum, uv:[0.6,0.2], ao:{lo:0,hi:0.4,dark:0.5}},
    ]);
    OBS_DEF[OT.SWEEP] = { geo, mat:OM.body(TEX.chevOrange), moving:true,
      hit:{ y0:0.16, y1:0.70, halfX:2.62, halfZ:0.70 }, sweep:true };
  }
  /* ---------- 1: high bar — dive under it ---------- */
  {
    const bar  = roundedBox(REF_HALF*2+0.4, 0.58, 0.56, 0.20, 2);
    const post = roundedBox(0.34, 1.60, 0.44, 0.14, 2);
    const foot = roundedBox(0.72, 0.20, 1.10, 0.09, 2);
